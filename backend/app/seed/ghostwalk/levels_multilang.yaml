  language: java
  intro_markdown: '*Rush hour. Order tickets on the floor point the way: red means
    turn left, blue means turn right. Tend the beds on the way to the roaster.*


    `Map.of` builds a lookup table, and `hero.readSign()` returns `"red"`, `"blue"`,
    or `null`:


    ```java

    var turns = Map.of("red", "left", "blue", "right");

    ```


    Two Java habits: check for `null` before using a value, and compare strings with
    `.equals()`, not `==`.

    '
