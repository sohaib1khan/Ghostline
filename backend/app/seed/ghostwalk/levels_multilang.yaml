- slug: bash-case-leds
  order: 8
  title: Blinking status lights
  concept: case
  language: bash
  intro_markdown: "*Every rack has a status light. Red means turn left, blue means\
    \ turn right. Follow them to the night-shift console and Cron's shift is done.*\n\
    \n`read_sign` prints the color of the light under Cron, and `$(read_sign)` captures\
    \ it. `case` matches it against patterns:\n\n```bash\ncase $(read_sign) in\n \
    \ red)  echo \"left\" ;;\n  blue) echo \"right\" ;;\nesac\n```\n\n`;;` ends each\
    \ branch, and `esac` is `case` backwards.\n"
