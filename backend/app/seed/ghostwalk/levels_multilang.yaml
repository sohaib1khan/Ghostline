- slug: sql-case-closed
  order: 7
  title: Case closed
  concept: CASE
  language: sql
  intro_markdown: "*Colored bookmarks on the floor lead to the commit desk: red means\
    \ turn left, blue means turn right.*\n\n`read_sign()` returns `'red'`, `'blue'`,\
    \ or `NULL`. A `CASE` statement picks what to do:\n\n```sql\nCASE read_sign()\n\
    \  WHEN 'red' THEN CALL turn_left();\n  WHEN 'blue' THEN CALL turn_right();\n\
    \  ELSE NULL;\nEND CASE;\n```\n\n**Careful:** in PL/pgSQL, a `CASE` with no matching\
    \ `WHEN` and no `ELSE` raises an error. `ELSE NULL;` means *do nothing*.\n"
  grid:
  - '#########'
  - '#b.....b#'
  - '#.......#'
  - '#...r..b#'
