- slug: bash-exit-codes
  order: 4
  title: Exit codes
  concept: until, if, and exit status
  language: bash
  intro_markdown: '*The old server room is a spiral of cages, and the lights are off.
    Cron has to feel the way.*


    In Bash, every command finishes with an **exit status**: success or failure. `if`
    and loops test that status, not a true/false value:


    - `blocked` succeeds when a wall is ahead.

    - `at_goal` succeeds on the console port.


    `until at_goal; do ... done` repeats until `at_goal` succeeds. `if blocked; then
    ... else ... fi` picks a branch. (`fi` is `if` backwards.)

    '
  grid:
  - '#########'
  - '#S#.....#'
  - '#.#.###.#'
  - '#.#.#G#.#'
  - '#.#.#.#.#'
  - '#.#...#.#'
  - '#.#####.#'
  - '#.......#'
  - '#########'
  start:
    row: 1
    col: 1
    facing: S
  allowed:
  - move
  - turn_left
  - is_blocked
  - at_goal
  goal:
    reach_goal: true
  max_steps: 500
  mode: free
  starter_code: "until at_goal; do\n  move\ndone\n"
  solution: "until at_goal; do\n  if blocked; then\n    turn_left\n  else\n    move\n\
    \  fi\ndone\n"
