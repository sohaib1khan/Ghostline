    small ghost named **Cron** wakes up on schedule, as always. Cron only understands
    shell commands.*


    In Bash you run a command by typing its name. No parentheses, no semicolons needed:


    ```bash

    move

    ```


    A `;` lets you put two commands on one line: `move; move`.


    Float Cron down the aisle to the console port.

    '
