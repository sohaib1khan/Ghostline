    \ (!hero.atGoal()) {\n    hero.move();\n}\n"
  solution: "var turns = Map.of(\"red\", \"left\", \"blue\", \"right\");\n\nwhile\
    \ (!hero.atGoal()) {\n    hero.move();\n    if (hero.onSoil()) {\n        hero.plant();\n\
    \        hero.water();\n        hero.harvest();\n    }\n    String ticket = hero.readSign();\n\
    \    if (ticket != null) {\n        if (turns.get(ticket).equals(\"left\")) {\n\
    \            hero.turnLeft();\n        } else {\n            hero.turnRight();\n\
    \        }\n    }\n}\n"
