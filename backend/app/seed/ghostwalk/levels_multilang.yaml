# Extra Ghostwalk packs: other languages + Ghostfarm.
# Seeded with only_missing=True so existing Python levels are left alone.
levels:
  # --- JavaScript ---
  - slug: js-first-steps
    order: 1
    title: First steps (JS)
    concept: Calling a method
    language: javascript
    intro_markdown: |
      Your ghost follows your code. `hero.move()` moves one tile forward.
      Reach the glowing goal tile.
    grid:
      - "#######"
      - "#S...G#"
      - "#######"
    start: {row: 1, col: 1, facing: E}
    allowed: [move]
    goal: {reach_goal: true}
    max_steps: 500
    mode: guided
    starter_code: |
      hero.move()
    solution: |
      hero.move()
      hero.move()
      hero.move()
      hero.move()
    hints:
      - Each hero.move() is one tile. You need four.
    par_lines: 4
    xp: 20
    status: published

  - slug: js-turn-corner
    order: 2
    title: Turn the corner (JS)
    concept: Sequence
    language: javascript
    intro_markdown: |
      `hero.turn_left()` and `hero.turn_right()` turn on the spot.
    grid:
      - "######"
      - "#S..##"
      - "###.##"
      - "###.G#"
      - "######"
    start: {row: 1, col: 1, facing: E}
    allowed: [move, turn_left, turn_right]
    goal: {reach_goal: true}
    max_steps: 500
    mode: guided
    starter_code: |
      hero.move()
      hero.move()
    solution: |
      hero.move()
      hero.move()
      hero.turn_right()
      hero.move()
      hero.move()
      hero.turn_left()
      hero.move()
    hints:
      - Walk east, turn right, walk south, turn left, walk to the goal.
    par_lines: 7
    xp: 20
    status: published

  - slug: js-loop-hall
    order: 3
    title: Loop hallway (JS)
    concept: for loops
    language: javascript
    intro_markdown: |
      Use a `for` loop instead of repeating `hero.move()`.

      ```js
      for (let i = 0; i < 3; i++) {
        hero.move()
      }
      ```
    grid:
      - "###########"
      - "#S.......G#"
      - "###########"
    start: {row: 1, col: 1, facing: E}
    allowed: [move]
    goal: {reach_goal: true}
    max_steps: 500
    mode: guided
    starter_code: |
      for (let i = 0; i < 3; i++) {
        hero.move()
      }
    solution: |
      for (let i = 0; i < 8; i++) {
        hero.move()
      }
    hints:
      - Count the empty tiles between S and G — that is eight moves.
    par_lines: 3
    xp: 25
    status: published

