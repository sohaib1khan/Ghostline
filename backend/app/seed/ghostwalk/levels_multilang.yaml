  # --- Ghostfarm (Python API, interactive mini-game) ---
  - slug: farm-first-plot
    order: 100
    title: First plot
    concept: Plant, water, harvest
    language: python
    intro_markdown: |
      Welcome to **Ghostfarm**. Soil tiles are `~`. Plant a seed, water it until it
      becomes a ripe crop `c`, harvest it, then walk to the barn `B`.

      ```python
      hero.plant()
      hero.water()
      hero.harvest()
      ```
    grid:
      - "#####"
      - "#S~B#"
      - "#####"
    start: {row: 1, col: 1, facing: E}
    allowed: [move, plant, water, harvest, on_soil, crops_held, at_goal]
    goal: {reach_goal: true, collect_crops: 1}
    max_steps: 500
    mode: farm
    starter_code: |
      hero.move()
      # plant, water, harvest, then walk to the barn
    solution: |
      hero.move()
      hero.plant()
      hero.water()
      hero.harvest()
      hero.move()
    hints:
      - Stand on soil (~), plant, water once, harvest, then move onto B.
    par_lines: 5
    xp: 25
    status: published

  - slug: farm-two-rows
    order: 101
    title: Two tidy rows
    concept: Loops on the farm
    language: python
    intro_markdown: |
      Two soil plots need crops before you deliver to the barn. A loop keeps the
      planting pattern short.
    grid:
      - "########"
      - "#S~~..B#"
      - "########"
    start: {row: 1, col: 1, facing: E}
    allowed: [move, turn_left, turn_right, plant, water, harvest, on_soil, crops_held, at_goal]
    goal: {reach_goal: true, collect_crops: 2}
    max_steps: 500
    mode: farm
    starter_code: |
      for _ in range(2):
          hero.move()
          hero.plant()
          hero.water()
          hero.harvest()
      # walk to the barn
    solution: |
      for _ in range(2):
          hero.move()
          hero.plant()
          hero.water()
          hero.harvest()
      hero.move()
      hero.move()
      hero.move()
    hints:
      - Plant both soils before walking the rest of the way to B.
      - You need collect_crops: 2 and to stand on the barn.
    par_lines: 10
    xp: 30
    status: published

