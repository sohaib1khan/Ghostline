    status: published
    lessons:
    - title: Books still out
      summary: Join users, loans, and books for open loans.
      body_markdown: '# Project: Books still out


        Join users → loans → books. Keep open loans, count books per reader, busiest first.

        Typing the joins in order is the understanding.'
      status: published
      is_demo: false
      source_type: original
      source_attribution: ''
      source_url: ''
      license_note: ''
      exercises:
      - runtime: none
        tokens:
        - match: JOIN loans
          explain: People to loans.
        - match: returned_at IS NULL
          explain: Still out.
        - match: GROUP BY
          explain: One row per reader.
        blanks: []
        simulated_output: 'name | books_out

          Ada  | 3

          '
        expected_output: null
        time_limit_seconds: null
        status: published
        type: trace
        order: 1
        prompt: Type the Books still out report.
        code: "SELECT\n  u.name,\n  COUNT(b.id) AS books_out\nFROM users u\nJOIN loans l ON l.user_id = u.id\nJOIN books b ON b.id = l.book_id\nWHERE l.returned_at IS NULL\nGROUP BY u.name\nORDER BY books_out DESC;"
        check:
          mode: either
          accepted_answers:
          - "SELECT\n  u.name,\n  COUNT(b.id) AS books_out\nFROM users u\nJOIN loans l ON l.user_id = u.id\nJOIN books b ON b.id = l.book_id\nWHERE l.returned_at IS NULL\nGROUP BY u.name\nORDER BY books_out DESC;"
