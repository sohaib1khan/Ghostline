slug: sql
name: SQL
description: Standard SQL, one statement at a time. Written the way PostgreSQL reads
  it.
modules:
- title: Reading rows
  description: Beginner — Ask a table for the rows you want.
  status: published
  lessons:
  - title: One column
    summary: Read a single column from a table.
    body_markdown: 'A table holds rows. A column is one fact on every row, such as
      a title.


      `SELECT` chooses columns. `FROM` names the table. Text in the database uses
      single quotes; these names do not, because they are identifiers.


      Keywords may be upper or lower case. A semicolon can end the statement. Both
      are accepted here.'
    status: published
    is_demo: true
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
    - type: trace
      prompt: Type the query that reads the title of every book.
      runtime: none
      code: SELECT title FROM books
      tokens:
      - match: SELECT
        explain: Chooses which columns come back.
      - match: FROM
        explain: Names the table that holds the rows.
      blanks: []
      check:
        mode: either
        accepted_answers:
        - SELECT title FROM books
        - SELECT title FROM books;
        normalize: &id001
          collapse_whitespace: true
          trim: true
          equivalent_quotes: false
          case_sensitive: false
        rules: []
      hints: []
      simulated_output: 'title

        Dune

        The Dispossessed'
      expected_output: null
      xp: 10
      time_limit_seconds: null
      status: published
      order: null
    - type: fill
      prompt: Fill the keyword that names the table.
      runtime: none
      code: SELECT title FROM books
      tokens: []
      blanks:
      - index: 3
        placeholder: ____
      check:
        mode: either
        accepted_answers:
        - SELECT title FROM books
        - SELECT title FROM books;
        normalize: *id001
        rules: []
      hints: []
      simulated_output: 'title

        Dune

        The Dispossessed'
      expected_output: null
      xp: 10
      time_limit_seconds: null
      status: published
      order: null
    - type: recall
      prompt: Read the title column from books.
      runtime: none
      code: ''
      tokens: []
      blanks: []
      check:
        mode: either
        accepted_answers:
        - SELECT title FROM books
        - SELECT title FROM books;
        normalize: *id001
        rules: []
      hints: []
      simulated_output: 'title

        Dune

        The Dispossessed'
      expected_output: null
      xp: 10
      time_limit_seconds: null
      status: published
      order: null
  - title: Every column
    summary: Read a whole row without naming each column.
    body_markdown: '`*` means every column. It is handy while you are looking around.
      Name the columns in a query you plan to keep, so a new column does not change
      the shape of the result.'
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
    - type: trace
      prompt: Type the query that reads every column from books.
      runtime: none
      code: SELECT * FROM books
      tokens:
      - match: SELECT
        explain: Starts the query.
      - match: '*'
        explain: Means every column.
      blanks: []
      check:
        mode: either
        accepted_answers:
        - SELECT * FROM books
        - SELECT * FROM books;
        normalize: *id001
        rules: []
      hints: []
      simulated_output: 'id | title | year

        1 | Dune | 1965'
      expected_output: null
      xp: 10
      time_limit_seconds: null
      status: published
      order: null
