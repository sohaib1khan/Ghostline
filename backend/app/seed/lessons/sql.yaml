  - title: Unique values
    summary: Drop repeated values from the result.
    body_markdown: '`DISTINCT` keeps one copy of each result row. On one column, that
      is the set of values in use. It sorts enough to find the duplicates, so a large
      table can make it slow.'
    status: published
    is_demo: false
