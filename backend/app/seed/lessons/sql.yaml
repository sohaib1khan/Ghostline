  - title: Sort and stop
    summary: Order the rows, then keep a page of them.
    body_markdown: '`ORDER BY` sorts the result. `DESC` puts the largest value first.
      `ASC` is the default.


      `LIMIT` stops after a number of rows. `OFFSET` skips rows before that page.
      PostgreSQL, MySQL, and SQLite use `LIMIT`. SQL Server writes `OFFSET ... FETCH`
      instead.'
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
    - type: trace
      prompt: Type the query for the five newest titles.
      runtime: none
      code: SELECT title FROM books ORDER BY year DESC LIMIT 5
      tokens:
      - match: ORDER BY
        explain: Sorts the result.
      - match: LIMIT
        explain: Stops after this many rows.
      blanks: []
      check:
