  - title: An empty value
    summary: Find rows where a column was never set.
    body_markdown: '`NULL` means the value is missing. It is not an empty string,
      and it is not equal to anything, including another `NULL`.


      Use `IS NULL` or `IS NOT NULL`. The test `subtitle = NULL` does not find those
      rows.'
