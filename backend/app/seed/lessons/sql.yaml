- title: Choosing rows
  description: Beginner — Combine tests, match patterns, and notice missing values.
  status: published
  lessons:
  - title: Two tests
    summary: Require both conditions.
    body_markdown: '`AND` keeps a row only when both tests pass. `OR` keeps it when
      either test passes. `AND` binds more tightly than `OR`, so use parentheses when
      you mix them.'
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
