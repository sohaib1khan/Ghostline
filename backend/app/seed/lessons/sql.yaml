  - title: A set of values
    summary: Match any value in a list.
    body_markdown: '`IN` is true when the value is one of the items in parentheses.
      It is the same idea as several `OR` tests, and easier to read.


      Strings use single quotes. A quote inside a string is written twice, as in `''O''''Brien''`.'
    status: published
