  - title: A pattern
    summary: Match part of a string.
    body_markdown: '`LIKE` matches a pattern. `%` means any sequence of characters.
      `_` means one character. `D%` means the text starts with D.


      PostgreSQL also has `ILIKE` for a case-insensitive pattern. Standard `LIKE`
      follows the database''s collation.'
