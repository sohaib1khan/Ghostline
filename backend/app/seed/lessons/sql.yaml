  - title: A matching row
    summary: Keep only the rows that pass a test.
    body_markdown: '`WHERE` runs a test on each row. `=` asks whether two values are
      the same. Numbers are written without quotes.


      `WHERE` does not change the stored table. It only chooses what this query returns.'
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
