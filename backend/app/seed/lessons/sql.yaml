      - match: WHERE
        explain: Holds the tests.
      blanks: []
      check:
        mode: either
        accepted_answers:
        - SELECT title FROM books WHERE year > 2000 AND pages < 400
        - SELECT title FROM books WHERE year > 2000 AND pages < 400;
