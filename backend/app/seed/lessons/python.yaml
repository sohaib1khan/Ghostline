  - title: Type hints
    summary: Say what goes in and comes out.
    body_markdown: "Hints after a parameter (`: type`) and after the parentheses (`->\
      \ type`) document a function. Editors and tools like mypy use them to catch\
      \ mistakes early.\n\n### Example\n\n```python\ndef average(values: list[float])\
      \ -> float:\n    return sum(values) / len(values)\n\ndef find(name: str, people:\
      \ dict[str, int]) -> int | None:\n    return people.get(name)\n\nprint(average([2.0,\
      \ 4.0]))       # -> 3.0\nprint(find(\"Zed\", {\"Ada\": 36}))  # -> None\n```\n\
      \n**Watch out:** Python does not enforce hints when the code runs. They are\
      \ notes for people and tools."
