          kind: must_contain
          value: 'try:'
          values: []
          maximum: null
          minimum: null
          pattern: null
        normalize:
          trim: true
          comma_space: true
          indent_levels: true
          case_sensitive: true
          equivalent_quotes: true
          collapse_whitespace: true
        accepted_answers:
        - "try:\n    number = int(\"abc\")\nexcept ValueError:\n    print(\"Not a\
          \ number\")"
      hints:
      - Type it exactly as shown, including every space at the start of a line.
      - 'Each nested line starts with Tab: press Tab once per level (1 Tab = 4 spaces).
        Enter keeps the indent; Backspace removes one level. The dots and the indent
        counter under the editor show how deep you are.'
      blanks: []
      prompt: Type the block that catches a bad number.
      tokens:
      - match: try
        explain: Attempt this code.
      - match: int
        explain: Converts to a whole number.
      - match: except
        explain: Runs if the matching error happens.
      - match: ValueError
        explain: The kind of error int() raises for bad text.
      - match: print
