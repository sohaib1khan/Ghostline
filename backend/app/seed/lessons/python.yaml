  - title: Morse code translator
    summary: Text to dots and dashes, and back.
    body_markdown: "Translate both ways with two dictionaries — one built with `zip`,\
      \ the other by flipping it with a comprehension.\n\n## What you will see\n\n\
      ```text\n... --- ... / .... . .-.. .--.\nsos help\n```\n\n## The plan\n\n1.\
      \ Build the two dictionaries\n2. Text to Morse\n3. Morse to text\n4. Try it\n\
      \n## Before you type\n\n- Press **Tab** once for each indent level. One Tab\
      \ is 4 spaces.\n- **Enter** keeps the indent of the line above. **Backspace**\
      \ removes one level.\n- Blank lines between parts are optional.\n- Stuck? Each\
      \ hint gives **one step**: every line, its line number, and its indent.\n\n\
      ## Step 1 of 4 · Build the two dictionaries\n\nPair each letter with its code,\
      \ then flip the pairs for decoding.\n\n```python\nLETTERS = \"abcdefghijklmnopqrstuvwxyz\"\
      \nCODES = (\".- -... -.-. -.. . ..-. --. .... .. .--- -.- .-.. -- \"\n     \
      \    \"-. --- .--. --.- .-. ... - ..- ...- .-- -..- -.-- --..\").split()\nTO_MORSE\
      \ = dict(zip(LETTERS, CODES))\nFROM_MORSE = {code: letter for letter, code in\
      \ TO_MORSE.items()}\n```\n\n- `CODES = (...).split()` — the 26 codes in alphabet\
      \ order; two strings in brackets join into one\n- `dict(zip(LETTERS, CODES))`\
      \ — a -> .-, b -> -..., and so on\n- `{code: letter for ...}` — the same pairs\
      \ the other way round\n\n## Step 2 of 4 · Text to Morse\n\nLowercase the text,\
      \ turn each letter into its code, put spaces between letters and / between words.\n\
      \n```python\ndef encode(text):\n    words = text.lower().split()\n    return\
      \ \" / \".join(\" \".join(TO_MORSE[c] for c in word if c in TO_MORSE) for word\
      \ in words)\n```\n\n- `if c in TO_MORSE` — skip characters that have no code\n\
      \n## Step 3 of 4 · Morse to text\n\nSplit on / into words, split each word on\
      \ spaces into codes, and look each code up.\n\n```python\ndef decode(signal):\n\
      \    return \" \".join(\"\".join(FROM_MORSE[c] for c in word.split()) for word\
      \ in signal.split(\" / \"))\n```\n\n## Step 4 of 4 · Try it\n\nEncode a message,\
      \ print it, then decode it back.\n\n```python\nsignal = encode(\"SOS help\"\
      )\nprint(signal)\nprint(decode(signal))\n```\n\n## What you practice\n\n`zip`,\
      \ `dict`, dictionary comprehensions, `split`, and nested `join` calls.\n\n##\
      \ Stretch goal\n\nAdd numbers 0–9, then play the signal as beeps with a sound\
      \ library."
