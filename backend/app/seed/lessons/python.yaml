  - title: Endless streams
    summary: Ask for the next value when you want it.
    body_markdown: "A generator can run forever, because it only works when asked.\
      \ `next()` pulls one value at a time.\n\n### Example\n\n```python\ndef evens():\n\
      \    n = 0\n    while True:\n        yield n\n        n += 2\n\ngen = evens()\n\
      print(next(gen))   # -> 0\nprint(next(gen))   # -> 2\nprint(next(gen))   # ->\
      \ 4\n```\n\n**Watch out:** Never call `list()` on an endless generator. It never\
      \ finishes."
