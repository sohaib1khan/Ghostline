  - title: Random choices
    summary: Dice rolls, picks, and shuffles.
    body_markdown: '`random` gives you dice rolls (`randint`), picks (`choice`), and
      shuffles. `random.seed(n)` makes the results repeat, which helps when testing.


      ### Example


      ```python

      import random


      random.seed(7)                      # same results every run

      print(random.randint(1, 6))         # a whole number from 1 to 6

      print(random.choice(["rock", "paper", "scissors"]))


      cards = ["A", "K", "Q"]

      random.shuffle(cards)               # shuffles in place, returns None

      print(cards)

      ```


      **Watch out:** For passwords and tokens, use the `secrets` module instead. `random`
      is predictable.'
