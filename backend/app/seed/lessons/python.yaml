  - title: Sort by a key
    summary: Decide what to sort on.
    body_markdown: '`key=` takes a function. Python calls it on each item and sorts
      by the result. A **lambda** is a tiny unnamed function for exactly this job.


      ### Example


      ```python

      words = ["banana", "fig", "cherry"]

      print(sorted(words, key=len))   # -> [''fig'', ''banana'', ''cherry'']


      people = [("Ada", 36), ("Grace", 45), ("Alan", 41)]

      print(sorted(people, key=lambda p: p[1], reverse=True))

      # -> [(''Grace'', 45), (''Alan'', 41), (''Ada'', 36)]

      ```


      **Watch out:** Pass the function itself: `key=len`, not `key=len()`.'
