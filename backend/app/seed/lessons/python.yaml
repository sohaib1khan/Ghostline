  - title: The default-list trap
    summary: Why a list default is shared.
    body_markdown: "A default value is created **once**, when the function is defined.\
      \ A list default is therefore shared by every call. Use `None` and make a fresh\
      \ list inside.\n\n### Example\n\n```python\ndef add_bad(item, bag=[]):\n   \
      \ bag.append(item)\n    return bag\n\nprint(add_bad(\"a\"))   # -> ['a']\nprint(add_bad(\"\
      b\"))   # -> ['a', 'b']   (same list!)\n\ndef add(item, bag=None):\n    if bag\
      \ is None:\n        bag = []\n    bag.append(item)\n    return bag\n\nprint(add(\"\
      a\"))   # -> ['a']\nprint(add(\"b\"))   # -> ['b']\n```\n\n**Watch out:** The\
      \ same trap applies to dictionary and set defaults."
