- title: Comprehensions
  description: Intermediate — Build lists in one line.
  status: published
  lessons:
  - title: List comprehension
    summary: A loop inside brackets.
    body_markdown: 'A **list comprehension** builds a list in one line: `[expression
      for item in items]`. Add `if` at the end to keep only some items.


      ### Example


      ```python

      squares = [n * n for n in range(5)]

      print(squares)   # -> [0, 1, 4, 9, 16]


      evens = [n for n in range(10) if n % 2 == 0]

      print(evens)     # -> [0, 2, 4, 6, 8]

      ```


      **Watch out:** If a comprehension gets hard to read, a normal `for` loop is
      fine.'
