  - title: Terminal bar chart
    summary: Draw a sorted bar chart with plain text.
    body_markdown: "No plotting library needed. Scale each value to a bar of `#` characters\
      \ and line everything up with format specs.\n\n## What you will see\n\n```text\n\
      \  Python | #################### 48\n      JS | ################# 40\n    Bash\
      \ | ############ 30\n      Go | ######### 21\n```\n\n## The plan\n\n1. Find\
      \ the scale\n2. Draw each bar\n3. Draw a chart\n\n## Before you type\n\n- Press\
      \ **Tab** once for each indent level. One Tab is 4 spaces.\n- **Enter** keeps\
      \ the indent of the line above. **Backspace** removes one level.\n- Blank lines\
      \ between parts are optional.\n- Stuck? Each hint gives **one step**: every\
      \ line, its line number, and its indent.\n\n## Step 1 of 3 · Find the scale\n\
      \nThe biggest value gets the full width; every other bar is scaled to match.\n\
      \n```python\ndef bar_chart(data, width=20):\n    biggest = max(data.values())\n\
      ```\n\n- `max(data.values())` — the largest number in the dictionary\n\n## Step\
      \ 2 of 3 · Draw each bar\n\nGo from biggest to smallest and print a row of #\
      \ characters for each.\n\n```python\n    for label, value in sorted(data.items(),\
      \ key=lambda kv: kv[1], reverse=True):\n        bar = \"#\" * round(value /\
      \ biggest * width)\n        print(f\"{label:>8} | {bar} {value}\")\n```\n\n\
      - `\"#\" * n` — repeat # n times\n- `round(value / biggest * width)` — this\
      \ value's share of the full width\n- `:>8` — right-align the label in 8 characters\n\
      \n## Step 3 of 3 · Draw a chart\n\nSome sample data, then call the function.\n\
      \n```python\nlangs = {\"Python\": 48, \"Go\": 21, \"Bash\": 30, \"JS\": 40}\n\
      bar_chart(langs)\n```\n\n## What you practice\n\n`max`, sorting by value with\
      \ a lambda, string repetition, `round`, and alignment specs.\n\n## Stretch goal\n\
      \nAdd a `--percent` mode that prints each value as a share of the total."
