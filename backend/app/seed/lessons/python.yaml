  - title: Text adventure
    summary: Walk between rooms in a tiny world.
    body_markdown: "Rooms are dictionaries, exits are dictionaries inside them. A\
      \ list of moves walks the player through the map.\n\n## What you will see\n\n\
      ```text\nA dusty hall.\n> north: Books everywhere. A key glints.\n> west: You\
      \ can't go that way.\n> south: A dusty hall.\n> east: It smells of old bread.\n\
      You finish in the kitchen.\n```\n\n## The plan\n\n1. Build the map\n2. Walk\
      \ through the moves\n3. Play a short route\n\n## Before you type\n\n- Press\
      \ **Tab** once for each indent level. One Tab is 4 spaces.\n- **Enter** keeps\
      \ the indent of the line above. **Backspace** removes one level.\n- Blank lines\
      \ between parts are optional.\n- Stuck? Each hint gives **one step**: every\
      \ line, its line number, and its indent.\n\n## Step 1 of 3 · Build the map\n\
      \nEach room has a description and its exits. Each exit points to another room.\n\
      \n```python\nROOMS = {\n    \"hall\": {\"text\": \"A dusty hall.\", \"exits\"\
      : {\"north\": \"library\", \"east\": \"kitchen\"}},\n    \"library\": {\"text\"\
      : \"Books everywhere. A key glints.\", \"exits\": {\"south\": \"hall\"}},\n\
      \    \"kitchen\": {\"text\": \"It smells of old bread.\", \"exits\": {\"west\"\
      : \"hall\"}},\n}\n```\n\n- `\"exits\": {\"north\": \"library\"}` — going north\
      \ from here leads to the library\n\n## Step 2 of 3 · Walk through the moves\n\
      \nStart in a room, then try each move. Go through the door if it exists; otherwise\
