  - title: Match a pattern
    summary: Branch on the shape of data.
    body_markdown: "`match` compares a value against **patterns**. A list pattern\
      \ can capture parts into names. `case _` catches everything else.\n\n### Example\n\
      \n```python\ndef handle(command):\n    match command.split():\n        case\
      \ [\"go\", direction]:\n            return f\"Walking {direction}\"\n      \
      \  case [\"look\"]:\n            return \"You see a door\"\n        case _:\n\
      \            return \"Unknown command\"\n\nprint(handle(\"go north\"))   # ->\
      \ Walking north\nprint(handle(\"look\"))       # -> You see a door\nprint(handle(\"\
      dance\"))      # -> Unknown command\n```\n\n**Watch out:** `match` needs Python\
      \ 3.10 or newer."
