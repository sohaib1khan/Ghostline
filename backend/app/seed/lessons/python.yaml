  - title: Join text
    summary: Glue and repeat strings.
    body_markdown: '`+` glues two strings together. `*` repeats a string.


      ### Example


      ```python

      first = "Ghost"

      second = "line"

      print(first + second)      # -> Ghostline

      print(first + " " + second)  # -> Ghost line


      # Repeat

      print("ha" * 3)            # -> hahaha

      ```


      **Watch out:** `"age: " + 36` fails because you cannot add text and a number.
      Use an f-string or `str(36)`.'
