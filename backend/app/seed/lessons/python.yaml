  - title: Generators with yield
    summary: Produce values one at a time.
    body_markdown: "A function with `yield` becomes a **generator**. Each `yield`\
      \ hands out one value and pauses until the next one is asked for.\n\n### Example\n\
      \n```python\ndef countdown(n):\n    while n > 0:\n        yield n\n        n\
      \ -= 1\n\nfor number in countdown(3):\n    print(number)\n# -> 3\n# -> 2\n#\
      \ -> 1\n```"
