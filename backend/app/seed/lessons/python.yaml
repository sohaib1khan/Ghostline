  - title: Convert types
    summary: Text to number and back.
    body_markdown: 'Convert between types with `int()`, `float()`, and `str()`. `type()`
      tells you what something is.


      ### Example


      ```python

      print(int("42") + 1)    # -> 43

      print(str(7) + "!")     # -> 7!

      print(float("2.5"))     # -> 2.5

      print(type(3.5))        # -> <class ''float''>

      ```


      **Watch out:** `int("abc")` raises a ValueError. The Handling errors module
      shows how to catch it.'
