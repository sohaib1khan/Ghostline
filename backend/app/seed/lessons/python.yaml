  - title: Call the parent with super
    summary: Extend a parent's __init__ instead of copying it.
    body_markdown: "`super()` gives you the parent class. Call `super().__init__(...)`\
      \ so the parent sets up its part, then add your own.\n\n### Example\n\n```python\n\
      class Animal:\n    def __init__(self, name):\n        self.name = name\n\nclass\
      \ Dog(Animal):\n    def __init__(self, name, trick):\n        super().__init__(name)\n\
      \        self.trick = trick\n\nd = Dog(\"Rex\", \"roll\")\nprint(d.name, d.trick)\
      \   # -> Rex roll\n```"
