      \ = Account(\"Ada\", 50)\nacct.deposit(25)\nacct.withdraw(30)\ntry:\n    acct.withdraw(100)\n\
      except InsufficientFunds as error:\n    print(f\"Blocked: {error}\")\nprint(acct.balance,\
      \ acct.history)\n```\n\n- `try / except InsufficientFunds as error` — catch\
