- title: Collections toolkit
  description: Intermediate — Counter, defaultdict, namedtuple, deque.
  status: published
  lessons:
  - title: Count with Counter
    summary: Tally anything in one line.
    body_markdown: '`Counter` counts how often each item appears. `most_common(n)`
      returns the top items, biggest first.


      ### Example


      ```python

      from collections import Counter


      votes = ["tea", "coffee", "tea", "juice", "tea"]

      tally = Counter(votes)

      print(tally["tea"])           # -> 3

      print(tally["water"])         # -> 0

      print(tally.most_common(1))   # -> [(''tea'', 3)]

      ```'
