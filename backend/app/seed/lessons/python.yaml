  - title: Number guessing game
    summary: Guess the secret number with higher/lower clues.
    body_markdown: "The classic first game. The computer picks a number; you guess\
      \ until you hit it, with a clue after every miss.\n\n## What you will see\n\n\
      ```text\nGuess 1-50: 25\nLower!\nGuess 1-50: 12\nHigher!\nGuess 1-50: 16\nGot\
      \ it in 3 tries.\n```\n\n## The plan\n\n1. Import random\n2. Pick the secret\
      \ number\n3. Ask until the guess is right\n4. Start the game\n\n## Before you\
      \ type\n\n- Press **Tab** once for each indent level. One Tab is 4 spaces.\n\
      - **Enter** keeps the indent of the line above. **Backspace** removes one level.\n\
      - Blank lines between parts are optional.\n- Stuck? Each hint gives **one step**:\
      \ every line, its line number, and its indent.\n\n## Step 1 of 4 · Import random\n\
      \nrandom picks the secret number.\n\n```python\nimport random\n```\n\n## Step\
      \ 2 of 4 · Pick the secret number\n\nChoose a random number in the range and\
      \ start a try counter.\n\n```python\ndef play(low=1, high=50):\n    secret =\
      \ random.randint(low, high)\n    tries = 0\n```\n\n- `random.randint(low, high)`\
      \ — a whole number from low to high, both included\n\n## Step 3 of 4 · Ask until\
      \ the guess is right\n\nEach round reads a guess, counts it, and gives a clue.\n\
      \n```python\n    while True:\n        guess = int(input(f\"Guess {low}-{high}:\
      \ \"))\n        tries += 1\n        if guess < secret:\n            print(\"\
      Higher!\")\n        elif guess > secret:\n            print(\"Lower!\")\n  \
      \      else:\n            print(f\"Got it in {tries} tries.\")\n           \
      \ break\n```\n\n- `int(input(...))` — read what the player types and turn it\
      \ into a number\n- `tries += 1` — add one to the counter\n- `break` — leave\
      \ the loop when the guess is right\n\n## Step 4 of 4 · Start the game\n\nCall\
      \ the function so the game actually runs.\n\n```python\nplay()\n```\n\n## What\
      \ you practice\n\n`random.randint`, `input` and `int`, a `while True` loop,\
      \ `if/elif/else`, and `break`.\n\n## Stretch goal\n\nLimit the player to 7 tries\
      \ and reveal the number when they run out."
