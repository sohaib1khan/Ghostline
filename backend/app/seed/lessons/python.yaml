  - title: Bank account
    summary: Deposits, withdrawals, and a custom error.
    body_markdown: "Model an account with a class. Bad deposits raise `ValueError`;\
      \ overdrafts raise your own `InsufficientFunds`.\n\n## What you will see\n\n\
      ```text\nBlocked: Ada has only 45\n45 ['+25', '-30']\n```\n\n## The plan\n\n\
      1. Make your own error\n2. Set up the account\n3. Deposit money\n4. Withdraw\
      \ money\n5. Try it, including a blocked withdrawal\n\n## Before you type\n\n\
      - Press **Tab** once for each indent level. One Tab is 4 spaces.\n- **Enter**\
      \ keeps the indent of the line above. **Backspace** removes one level.\n- Blank\
      \ lines between parts are optional.\n- Stuck? Each hint gives **one step**:\
      \ every line, its line number, and its indent.\n\n## Step 1 of 5 · Make your\
      \ own error\n\nA named error for trying to take out more money than the account\
      \ has.\n\n```python\nclass InsufficientFunds(Exception):\n    pass\n```\n\n\
      - `pass` — an empty body; the name is all we need\n\n## Step 2 of 5 · Set up\
      \ the account\n\nEach account remembers its owner, balance, and a history of\
      \ changes.\n\n```python\nclass Account:\n    def __init__(self, owner, balance=0):\n\
      \        self.owner = owner\n        self.balance = balance\n        self.history\
      \ = []\n```\n\n- `__init__` — runs when you create an account\n- `self.history\
      \ = []` — a fresh, empty list for every account\n\n## Step 3 of 5 · Deposit\
      \ money\n\nRefuse zero or negative amounts; otherwise add the money and log\
      \ it.\n\n```python\n    def deposit(self, amount):\n        if amount <= 0:\n\
      \            raise ValueError(\"Deposit must be positive\")\n        self.balance\
      \ += amount\n        self.history.append(f\"+{amount}\")\n```\n\n- `raise ValueError(...)`\
      \ — stop with an error message\n\n## Step 4 of 5 · Withdraw money\n\nRefuse\
      \ to go below zero with your own error; otherwise take the money and log it.\n\
      \n```python\n    def withdraw(self, amount):\n        if amount > self.balance:\n\
      \            raise InsufficientFunds(f\"{self.owner} has only {self.balance}\"\
      )\n        self.balance -= amount\n        self.history.append(f\"-{amount}\"\
      )\n```\n\n## Step 5 of 5 · Try it, including a blocked withdrawal\n\nDeposit,\
