  - title: Index and slice
    summary: Pick characters out of a string.
    body_markdown: 'Each character has a position that starts at **0**. `[-1]` counts
      from the end. A slice `[start:end]` stops *before* `end`.


      ### Example


      ```python

      word = "python"

      print(word[0])     # -> p

      print(word[-1])    # -> n

      print(word[:3])    # -> pyt   (positions 0, 1, 2)

      print(word[2:])    # -> thon   (from 2 to the end)

      ```


      **Watch out:** `word[6]` is an error: the last position of a 6-letter word is
      5.'
