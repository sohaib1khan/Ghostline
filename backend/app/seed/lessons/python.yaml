  - title: Whole division and remainder
    summary: Split evenly and see what is left.
    body_markdown: '`//` divides and drops the decimal part. `%` gives the remainder.
      `**` raises to a power.


      ### Example


      ```python

      print(17 // 5)   # -> 3    (5 fits into 17 three times)

      print(17 % 5)    # -> 2    (2 is left over)

      print(2 ** 10)   # -> 1024


      # A classic use of %: is a number even?

      print(8 % 2 == 0)  # -> True

      ```'
