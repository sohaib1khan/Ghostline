  - title: CSV files
    summary: Rows and columns from a spreadsheet export.
    body_markdown: "The `csv` module reads and writes comma-separated files safely,\
      \ even when a value contains a comma. `DictReader` turns each row into a dictionary\
      \ keyed by the header.\n\n### Example\n\n```python\nimport csv\n\nwith open(\"\
      people.csv\", \"w\", newline=\"\") as f:\n    writer = csv.writer(f)\n    writer.writerow([\"\
      name\", \"age\"])\n    writer.writerow([\"Ada\", 36])\n\nwith open(\"people.csv\"\
      , newline=\"\") as f:\n    for row in csv.DictReader(f):\n        print(row[\"\
      name\"], row[\"age\"])   # -> Ada 36\n```\n\n**Watch out:** Every value comes\
      \ back as text. Use `int(row[\"age\"])` before doing math."
