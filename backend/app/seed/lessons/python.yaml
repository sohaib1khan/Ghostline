  - title: Split and join
    summary: Turn text into a list and back.
    body_markdown: '`split` breaks text into a list. `join` is the reverse: the separator
      comes first, then the list.


      ### Example


      ```python

      parts = "a,b,c".split(",")

      print(parts)               # -> [''a'', ''b'', ''c'']


      print("-".join(parts))     # -> a-b-c


      # split() with no argument splits on spaces

      print("one two three".split())  # -> [''one'', ''two'', ''three'']

      ```'
