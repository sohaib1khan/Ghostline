  - title: Add and remove
    summary: Grow and shrink a list.
    body_markdown: 'Lists can change. `append` adds to the end, `remove` deletes by
      value, `pop` takes the last item out and gives it back.


      ### Example


      ```python

      fruits = ["apple", "banana"]

      fruits.append("cherry")

      print(fruits)          # -> [''apple'', ''banana'', ''cherry'']


      fruits.remove("apple")

      print(fruits)          # -> [''banana'', ''cherry'']


      last = fruits.pop()

      print(last)            # -> cherry

      ```


      **Watch out:** `remove` raises an error if the value is not in the list.'
