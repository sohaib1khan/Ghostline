- title: Handling errors
  description: Beginner — Keep going when something fails.
  status: published
  lessons:
  - title: Try and except
    summary: Catch an error instead of crashing.
    body_markdown: "Code in `try` runs first. If it raises a matching error, the `except`\
      \ block runs instead of crashing the program.\n\n### Example\n\n```python\n\
      try:\n    number = int(\"abc\")\nexcept ValueError:\n    print(\"Not a number\"\
      )   # -> Not a number\n\nprint(\"Still running\")      # -> Still running\n\
      ```\n\n**Watch out:** Catch the specific error, like `ValueError`. A bare `except:`\
      \ hides real bugs."
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
    - xp: 10
      code: "try:\n    number = int(\"abc\")\nexcept ValueError:\n    print(\"Not\
        \ a number\")"
      type: trace
      check:
        mode: answers
