  - title: Raise an error
    summary: Stop bad input at the door.
    body_markdown: "`raise` creates an error on purpose. Callers can catch it with\
      \ `except ... as error` and read its message.\n\n### Example\n\n```python\n\
      def withdraw(balance, amount):\n    if amount > balance:\n        raise ValueError(\"\
      Not enough money\")\n    return balance - amount\n\nprint(withdraw(100, 30))\
      \   # -> 70\n\ntry:\n    withdraw(10, 50)\nexcept ValueError as error:\n   \
      \ print(error)           # -> Not enough money\n```\n\n**Watch out:** Raise\
      \ early, with a message a person can act on."
