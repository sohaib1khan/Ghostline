  - title: Read line by line
    summary: Loop over a file one line at a time.
    body_markdown: "Looping over an open file gives one line per round, so even huge\
      \ files fit in memory. `enumerate(f, start=1)` numbers them from 1.\n\n### Example\n\
      \n```python\nwith open(\"todo.txt\", \"w\") as f:\n    f.write(\"buy milk\\\
      ncall mom\\n\")\n\nwith open(\"todo.txt\") as f:\n    for number, line in enumerate(f,\
      \ start=1):\n        print(number, line.strip())\n# -> 1 buy milk\n# -> 2 call\
      \ mom\n```\n\n**Watch out:** Every line still ends with `\\n`. Call `.strip()`\
      \ before printing or comparing."
