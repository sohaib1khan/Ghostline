- title: Classes and objects
  description: Intermediate — Bundle data with the code that uses it.
  status: published
  lessons:
  - title: Your first class
    summary: A blueprint for objects.
    body_markdown: "A **class** describes a kind of object. `__init__` runs when you\
      \ create one, and `self` is the object being built. Methods are functions that\
      \ live inside the class.\n\n### Example\n\n```python\nclass Dog:\n    def __init__(self,\
      \ name):\n        self.name = name\n\n    def speak(self):\n        return f\"\
      {self.name} says woof\"\n\nrex = Dog(\"Rex\")\nprint(rex.name)      # -> Rex\n\
      print(rex.speak())   # -> Rex says woof\n```\n\n**Watch out:** Every method's\
      \ first parameter is `self`. Forgetting it gives a TypeError about arguments."
