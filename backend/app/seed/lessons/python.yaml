  - title: Password generator
    summary: Strong random passwords that always include a digit and a symbol.
    body_markdown: "Build a password generator you would actually use. It keeps drawing\
      \ until the password has at least one digit and one symbol.\n\n## What you will\
      \ see\n\n```text\nk7Gq!xP2mWa9\nR4t#vLz8QbN1s@yHc5Ed\n```\n\n## The plan\n\n\
      1. Import the tools and choose the symbols\n2. Build the alphabet\n3. Draw until\
      \ the password qualifies\n4. Try it\n\n## Before you type\n\n- Press **Tab**\
      \ once for each indent level. One Tab is 4 spaces.\n- **Enter** keeps the indent\
      \ of the line above. **Backspace** removes one level.\n- Blank lines between\
      \ parts are optional.\n- Stuck? Each hint gives **one step**: every line, its\
      \ line number, and its indent.\n\n## Step 1 of 4 · Import the tools and choose\
      \ the symbols\n\nsecrets makes safe random choices; string holds ready-made\
      \ letter and digit lists.\n\n```python\nimport secrets\nimport string\n\nSYMBOLS\
      \ = \"!@#$%\"\n```\n\n- `SYMBOLS` — the special characters a password may use\n\
      \n## Step 2 of 4 · Build the alphabet\n\nJoin letters, digits, and symbols into\
      \ one string of allowed characters.\n\n```python\ndef make_password(length=12):\n\
      \    alphabet = string.ascii_letters + string.digits + SYMBOLS\n```\n\n- `string.ascii_letters`\
      \ — a to z and A to Z\n- `string.digits` — 0 to 9\n\n## Step 3 of 4 · Draw until\
      \ the password qualifies\n\nKeep making passwords until one has a digit and\
      \ a symbol.\n\n```python\n    while True:\n        password = \"\".join(secrets.choice(alphabet)\
      \ for _ in range(length))\n        has_digit = any(c.isdigit() for c in password)\n\
      \        has_symbol = any(c in SYMBOLS for c in password)\n        if has_digit\
      \ and has_symbol:\n            return password\n```\n\n- `secrets.choice(alphabet)`\
      \ — one random allowed character\n- `for _ in range(length)` — do it length\
      \ times; _ means we do not need the counter\n- `\"\".join(...)` — glue the characters\
      \ into one string\n- `any(...)` — True if at least one character passes the\
      \ test\n- `return password` — hand it back and stop the loop\n\n## Step 4 of\
      \ 4 · Try it\n\nPrint one password of the default length and one of 20 characters.\n\
      \n```python\nprint(make_password())\nprint(make_password(20))\n```\n\n## What\
      \ you practice\n\nthe `secrets` module, `string` constants, generator expressions,\
      \ `any`, and a `while True` loop with `return`.\n\n## Stretch goal\n\nAdd a\
      \ `words` mode that builds a passphrase like `river-cloud-amber-7` from a word\
      \ list."
