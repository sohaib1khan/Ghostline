  - title: Say hello
    summary: Print a short greeting.
    body_markdown: '`print` shows a value on the screen. Text goes inside quotes,
      so Python knows it is text and not a name.


      ### Example


      ```python

      # Print a word

      print("hello")  # -> hello


      # Print a whole sentence

      print("Hello, Ghostline!")  # -> Hello, Ghostline!


      # Print a number (no quotes needed)

      print(42)  # -> 42

      ```


      **Watch out:** Forgetting the quotes, as in `print(hello)`, makes Python look
      for a variable named hello.'
