  - title: Make a list
    summary: Square brackets, commas between items.
    body_markdown: 'A **list** keeps items in order inside square brackets. Positions
      start at 0, like strings.


      ### Example


      ```python

      fruits = ["apple", "banana", "cherry"]

      print(fruits[0])     # -> apple

      print(fruits[-1])    # -> cherry

      print(len(fruits))   # -> 3

