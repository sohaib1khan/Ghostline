      \ gets every method, and can replace (override) the ones it needs to change.\n\
      \n### Example\n\n```python\nclass Animal:\n    def __init__(self, name):\n \
      \       self.name = name\n\n    def speak(self):\n        return \"...\"\n\n\
      class Cat(Animal):\n    def speak(self):\n        return f\"{self.name} says\
      \ meow\"\n\nprint(Cat(\"Tom\").speak())       # -> Tom says meow\nprint(Animal(\"\
      Blob\").speak())   # -> ...\n```"
