  - title: Caesar cipher
    summary: Encode and decode secret messages.
    body_markdown: "Shift every letter along the alphabet — Julius Caesar's own trick.\
      \ Shift forward to encode, backward to decode.\n\n## What you will see\n\n```text\n\
      Phhw dw Qrrq!\nMeet at Noon!\n```\n\n## The plan\n\n1. Import string\n2. Decide\
      \ each character's alphabet\n3. Shift the letter\n4. Encode and decode\n\n##\
      \ Before you type\n\n- Press **Tab** once for each indent level. One Tab is\
      \ 4 spaces.\n- **Enter** keeps the indent of the line above. **Backspace** removes\
      \ one level.\n- Blank lines between parts are optional.\n- Stuck? Each hint\
      \ gives **one step**: every line, its line number, and its indent.\n\n## Step\
      \ 1 of 4 · Import string\n\nstring gives the lowercase and uppercase alphabets.\n\
      \n```python\nimport string\n```\n\n## Step 2 of 4 · Decide each character's\
      \ alphabet\n\nWalk through every character. Letters get a starting point; anything\
      \ else is kept as it is.\n\n```python\ndef shift_text(text, shift):\n    result\
      \ = []\n    for char in text:\n        if char in string.ascii_lowercase:\n\
      \            start = ord(\"a\")\n        elif char in string.ascii_uppercase:\n\
      \            start = ord(\"A\")\n        else:\n            result.append(char)\n\
      \            continue\n```\n\n- `ord(\"a\")` — the number for the letter a;\
      \ ord turns a letter into a number\n- `continue` — skip to the next character\
      \ without shifting\n\n## Step 3 of 4 · Shift the letter\n\nTurn the letter into\
      \ a number, move it, wrap past z back to a, then turn it back into a letter.\n\
      \n```python\n        result.append(chr((ord(char) - start + shift) % 26 + start))\n\
      \    return \"\".join(result)\n```\n\n- `ord(char) - start` — position in the\
      \ alphabet, 0 to 25\n- `% 26` — wrap around: 26 becomes 0\n- `chr(...)` — number\
      \ back to a letter\n- `\"\".join(result)` — glue the characters into one string\n\
      \n## Step 4 of 4 · Encode and decode\n\nShift forward by 3 to hide the message,\
      \ then back by 3 to read it.\n\n```python\nsecret = shift_text(\"Meet at Noon!\"\
      , 3)\nprint(secret)\nprint(shift_text(secret, -3))\n```\n\n## What you practice\n\
      \n`ord` and `chr`, the `%` operator for wrap-around, `continue`, and building\
      \ a string from a list.\n\n## Stretch goal\n\nCrack a message without the key:\
      \ try all 26 shifts and print the one with the most common English words."
