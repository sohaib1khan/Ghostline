  - title: Plan tidy file names
    summary: Preview renames before touching any file.
    body_markdown: "Messy downloads? This script plans clean names — lowercase, dashes\
      \ instead of spaces — and prints `old -> new` for each file that would change.\
      \ It never renames anything, so it is safe to run.\n\nIn real use, feed it `[p.name\
      \ for p in Path(\"Downloads\").iterdir()]`, then call `Path.rename` once the\
      \ plan looks right.\n\n## What you will see\n\n```text\nMy Holiday PHOTO.JPG\
      \ -> my-holiday-photo.jpg\nTax Return 2026.PDF -> tax-return-2026.pdf\n```\n\
      \n## The plan\n\n1. Clean one file name\n2. Plan the renames\n3. Print the plan\n\
      \n## Before you type\n\n- Press **Tab** once for each indent level. One Tab\
      \ is 4 spaces.\n- **Enter** keeps the indent of the line above. **Backspace**\
      \ removes one level.\n- Blank lines between parts are optional.\n- Stuck? Each\
