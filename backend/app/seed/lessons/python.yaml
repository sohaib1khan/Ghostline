  lessons:
  - title: Scoreboard
    summary: Rank scores and print the top names.
    body_markdown: "Rank players by score and print the top two.\n\n## What you will\
      \ see\n\n```text\ngrace: 18\nada: 12\n```\n\n## The plan\n\n1. Store the scores\n\
      2. Rank and keep the top\n3. Print the winners\n\n## Before you type\n\n- Press\
      \ **Tab** once for each indent level. One Tab is 4 spaces.\n- **Enter** keeps\
      \ the indent of the line above. **Backspace** removes one level.\n- Blank lines\
      \ between parts are optional.\n- Stuck? Each hint gives **one step**: every\
      \ line, its line number, and its indent.\n\n## Step 1 of 3 · Store the scores\n\
      \nA dictionary: each name points to a score.\n\n```python\nscores = {\"ada\"\
      : 12, \"grace\": 18, \"linus\": 9}\n```\n\n## Step 2 of 3 · Rank and keep the\
      \ top\n\nSort the pairs by score, highest first, and keep the first few.\n\n\
      ```python\ndef leaders(table, limit=2):\n    ranked = sorted(table.items(),\
      \ key=lambda item: item[1], reverse=True)\n    return ranked[:limit]\n```\n\n\
      - `table.items()` — pairs like (\"ada\", 12)\n- `key=lambda item: item[1]` —\
      \ sort by the score, the second item of each pair\n- `reverse=True` — highest\
      \ first\n- `ranked[:limit]` — keep the first limit pairs\n\n## Step 3 of 3 ·\
      \ Print the winners\n\nUnpack each pair and print it.\n\n```python\nfor name,\
      \ score in leaders(scores):\n    print(f\"{name}: {score}\")\n```"
