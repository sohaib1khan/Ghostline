  - title: Split the bill
    summary: Who pays whom after a group trip.
    body_markdown: "Everyone paid different amounts. Work out each person's balance\
      \ and the fewest simple transfers to settle up.\n\n## What you will see\n\n\
      ```text\nGrace pays Ada 40.00\nLinus pays Ada 10.00\n```\n\n## The plan\n\n\
      1. Work out each person's balance\n2. Match payers with receivers\n3. Try it\n\
      \n## Before you type\n\n- Press **Tab** once for each indent level. One Tab\
      \ is 4 spaces.\n- **Enter** keeps the indent of the line above. **Backspace**\
      \ removes one level.\n- Blank lines between parts are optional.\n- Stuck? Each\
      \ hint gives **one step**: every line, its line number, and its indent.\n\n\
      ## Step 1 of 3 · Work out each person's balance\n\nEveryone should pay the same\
      \ share. Positive balance means they get money back; negative means they owe.\n\
      \n```python\ndef settle(paid):\n    share = sum(paid.values()) / len(paid)\n\
      \    balances = {name: round(amount - share, 2) for name, amount in paid.items()}\n\
      \    owes = [[name, -b] for name, b in balances.items() if b < 0]\n    gets\
      \ = [[name, b] for name, b in balances.items() if b > 0]\n    transfers = []\n\
      ```\n\n- `share` — total divided by the number of people\n- `owes / gets` —\
      \ two lists: people who owe, and people who are owed\n\n## Step 2 of 3 · Match\
      \ payers with receivers\n\nTake the first person who owes and the first who\
      \ is owed, move the smaller amount, and remove anyone who is settled.\n\n```python\n\
      \    while owes and gets:\n        debtor, creditor = owes[0], gets[0]\n   \
      \     amount = round(min(debtor[1], creditor[1]), 2)\n        transfers.append(f\"\
      {debtor[0]} pays {creditor[0]} {amount:.2f}\")\n        debtor[1] -= amount\n\
      \        creditor[1] -= amount\n        if debtor[1] < 0.01:\n            owes.pop(0)\n\
      \        if creditor[1] < 0.01:\n            gets.pop(0)\n    return transfers\n\
      ```\n\n- `min(...)` — the most this payment can be\n- `:.2f` — money with 2\
      \ decimals\n- `owes.pop(0)` — remove the first person once they are settled\n\
      \n## Step 3 of 3 · Try it\n\nThree people paid different amounts. Print who\
      \ pays whom.\n\n```python\ntrip = {\"Ada\": 120, \"Grace\": 30, \"Linus\": 60}\n\
      for line in settle(trip):\n    print(line)\n```\n\n## What you practice\n\n\
      dictionary comprehensions, list filtering, `while` over two lists, rounding\
      \ money, and format specs.\n\n## Stretch goal\n\nAccept expenses like `(\"Ada\"\
      , 45, \"dinner\")` and print a per-category breakdown too."
