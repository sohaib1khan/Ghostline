  - title: Dictionary comprehension
    summary: Build a dictionary in one line.
    body_markdown: 'Swap the square brackets for braces and write `key: value` at
      the front: `{key: value for item in items}`.


      ### Example


      ```python

      words = ["apple", "fig", "kiwi"]

      lengths = {word: len(word) for word in words}

      print(lengths)   # -> {''apple'': 5, ''fig'': 3, ''kiwi'': 4}


      prices = {"tea": 3, "cake": 5}

      doubled = {item: cost * 2 for item, cost in prices.items()}

      print(doubled)   # -> {''tea'': 6, ''cake'': 10}

      ```'
