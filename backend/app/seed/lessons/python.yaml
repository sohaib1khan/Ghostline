    summary: Pad and align columns.
    body_markdown: "A number after the colon sets a width. `<` aligns left, `>` right,\
      \ `^` center. `0` before the width pads with zeros.\n\n### Example\n\n```python\n\
      for name, score in [(\"Ada\", 9), (\"Grace\", 12)]:\n    print(f\"{name:<8}{score:>4}\"\
      )\n# -> Ada        9\n# -> Grace     12\n\nprint(f\"{7:03}\")          # ->\
