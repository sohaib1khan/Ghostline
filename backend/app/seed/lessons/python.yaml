  - title: How long
    summary: Ask for the length of a word.
    body_markdown: '`len` counts things: characters in a string, items in a list.
      It returns a number you can print or store.


      ### Example


      ```python

      # Count characters, including spaces

      print(len("hello"))        # -> 5

      print(len("hi there"))     # -> 8


      # Store the result

      size = len("python")

      print(size)                # -> 6

      ```'
