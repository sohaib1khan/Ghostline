  - title: Sets
    summary: Only unique values.
    body_markdown: 'A **set** keeps only unique values and has no order. It is the
      quickest way to drop duplicates.


      ### Example


      ```python

      colors = {"red", "blue", "red"}

      print(len(colors))            # -> 2


      numbers = [1, 1, 2, 3, 3]

      print(sorted(set(numbers)))   # -> [1, 2, 3]

      ```


      **Watch out:** `{}` makes an empty dictionary, not a set. Use `set()` for an
      empty set.'
