  - title: Else and finally
    summary: Run code on success, and always clean up.
    body_markdown: "`else` runs only when `try` raised nothing. `finally` runs every\
      \ time, error or not. Use it for clean-up.\n\n### Example\n\n```python\ndef\
      \ parse(text):\n    try:\n        number = int(text)\n    except ValueError:\n\
      \        print(\"bad input\")\n    else:\n        print(\"got\", number)\n \
      \   finally:\n        print(\"done\")\n\nparse(\"7\")\n# -> got 7\n# -> done\n\
      parse(\"x\")\n# -> bad input\n# -> done\n```"
