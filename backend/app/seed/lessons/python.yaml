  - title: Your own error type
    summary: Name the problem precisely.
    body_markdown: "A custom error is a class that inherits from `Exception`. An empty\
      \ body with `pass` is enough. Callers can then catch exactly that problem.\n\
      \n### Example\n\n```python\nclass OutOfStock(Exception):\n    pass\n\ndef take(stock,\
      \ item):\n    if stock.get(item, 0) == 0:\n        raise OutOfStock(item)\n\
      \    stock[item] -= 1\n\nstock = {\"pen\": 1}\ntake(stock, \"pen\")\ntry:\n\
      \    take(stock, \"pen\")\nexcept OutOfStock as error:\n    print(f\"Sold out:\
      \ {error}\")   # -> Sold out: pen\n```"
