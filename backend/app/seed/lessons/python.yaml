  - title: A name
    summary: Store text in a variable.
    body_markdown: 'A **variable** is a name that points to a value. Create one with
      `=`, then use the name wherever you need the value.


      ### Example


      ```python

      # Store text in a variable

      name = "Ada"


      # Use it later

      print(name)  # -> Ada


      # Reassign it: the name now points to a new value

      name = "Grace"

      print(name)  # -> Grace

      ```


      **Watch out:** `=` means *store*, not *equals*. Checking equality uses `==`
      (later lesson).'
