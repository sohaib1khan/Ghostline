      code: "if (size := len(word)) > 5:\n    print(f\"{word} is long ({size})\")"
      type: trace
      check:
        mode: answers
        rules:
        - hint: 'Something differs from the code shown above. Compare it character
            by character: quotes, brackets, colons, commas, and the spaces at the
            start of each line.'
          kind: must_contain
          value: if
          values: []
          maximum: null
          minimum: null
          pattern: null
        normalize:
          trim: true
          comma_space: true
          indent_levels: true
          case_sensitive: true
          equivalent_quotes: true
          collapse_whitespace: true
        accepted_answers:
        - "if (size := len(word)) > 5:\n    print(f\"{word} is long ({size})\")"
      hints:
      - Type it exactly as shown, including every space at the start of a line.
      - 'Each nested line starts with Tab: press Tab once per level (1 Tab = 4 spaces).
        Enter keeps the indent; Backspace removes one level. The dots and the indent
        counter under the editor show how deep you are.'
      blanks: []
      prompt: Type an if that measures and checks in one step.
      tokens:
      - match: :=
        explain: Assign and use at once.
      runtime: none
      expected_output: null
      simulated_output: extraordinary is long (13)
      time_limit_seconds: null
      status: published
      order: 1
      walkthrough:
        setup: word = "extraordinary"
        notes:
          1: := stores len(word) in size AND uses it in the check, all in one step.
          2: size is already set from the line above.
      quiz:
      - kind: output
        q: What does this print?
        code: "if (n := len(\"hello\")) > 3:\n    print(n)"
        answer: '5'
        wrong:
        - 'True'
        - hello
        why: := stores 5 in n and the check uses it.
      - kind: output
        q: What does this print?
        code: 'data = [1, 5, 9]

          print([y for x in data if (y := x * 2) > 5])'
        answer: '[10, 18]'
        wrong:
        - '[2, 10, 18]'
        - '[5, 9]'
        why: y is computed once and reused.
