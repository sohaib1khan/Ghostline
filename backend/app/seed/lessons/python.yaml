  - title: Dates and times
    summary: Add days and count between dates.
    body_markdown: '`date` holds a calendar day. Add a `timedelta` to move forward
      or back, subtract two dates to get the gap, and `strftime` formats it.


      ### Example


      ```python

      from datetime import date, timedelta


      start = date(2026, 1, 30)

      print(start + timedelta(days=3))            # -> 2026-02-02

      print((date(2026, 12, 25) - start).days)    # -> 329

      print(start.strftime("%d %b %Y"))           # -> 30 Jan 2026

      ```'
