  - title: A formatted line
    summary: Build a sentence from a name.
    body_markdown: 'An **f-string** starts with `f` before the quote. Anything inside
      `{}` is replaced by its value.


      ### Example


      ```python

      name = "Ada"

      age = 36


      # Values drop straight into the text

      print(f"Hello {name}")                 # -> Hello Ada

      print(f"{name} is {age} years old")    # -> Ada is 36 years old


      # You can even put small expressions inside {}

      print(f"Next year: {age + 1}")         # -> Next year: 37

      ```


      **Watch out:** Without the `f`, the braces are printed as-is: `Hello {name}`.'
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
    - xp: 10
      code: print(f"Hello {name}")
