  - title: Monthly budget report
    summary: Total spending by category from CSV.
    body_markdown: "Bank exports are usually CSV. This script adds up spending per\
      \ category, sorts the biggest first, and prints a tidy two-column report with\
      \ a total line.\n\nIn real use, replace `io.StringIO(text)` with an open CSV\
      \ file.\n\n## What you will see\n\n```text\nfood         20.50\nfun        \
      \  20.00\ntransport     3.20\ntotal        43.70\n```\n\n## The plan\n\n1. Import\
      \ the tools\n2. Paste in sample data\n3. Add up each category\n4. Print the\
      \ report\n\n## Before you type\n\n- Press **Tab** once for each indent level.\
      \ One Tab is 4 spaces.\n- **Enter** keeps the indent of the line above. **Backspace**\
      \ removes one level.\n- Blank lines between parts are optional.\n- Stuck? Each\
      \ hint gives **one step**: every line, its line number, and its indent.\n\n\
      ## Step 1 of 4 · Import the tools\n\ncsv reads spreadsheet-style text, io lets\
      \ a string act like a file, defaultdict starts new totals at 0.\n\n```python\n\
      import csv\nimport io\nfrom collections import defaultdict\n```\n\n## Step 2\
      \ of 4 · Paste in sample data\n\nA tiny CSV: a header row, then one row per\
      \ purchase.\n\n```python\nDATA = \"\"\"date,category,amount\n2026-09-01,food,12.50\n\
      2026-09-02,transport,3.20\n2026-09-02,food,8.00\n2026-09-05,fun,20.00\n\"\"\"\
      \n```\n\n## Step 3 of 4 · Add up each category\n\nRead every row and add its\
      \ amount to that category's total.\n\n```python\ndef totals_by_category(text:\
      \ str) -> dict[str, float]:\n    totals = defaultdict(float)\n    for row in\
      \ csv.DictReader(io.StringIO(text)):\n        totals[row[\"category\"]] += float(row[\"\
      amount\"])\n    return totals\n```\n\n- `defaultdict(float)` — a new category\
      \ starts at 0.0 automatically\n- `csv.DictReader(io.StringIO(text))` — each\
      \ row becomes a dictionary keyed by the header\n- `float(row[\"amount\"])` —\
      \ CSV values are text; float() turns them into numbers\n\n## Step 4 of 4 · Print\
      \ the report\n\nPrint categories from biggest spend to smallest, then a total\
      \ line.\n\n```python\nif __name__ == \"__main__\":\n    totals = totals_by_category(DATA)\n\
      \    for category, amount in sorted(totals.items(), key=lambda kv: kv[1], reverse=True):\n\
      \        print(f\"{category:<10}{amount:>8.2f}\")\n    print(f\"{'total':<10}{sum(totals.values()):>8.2f}\"\
      )\n```\n\n- `key=lambda kv: kv[1]` — sort by the amount, not the name\n- `reverse=True`\
      \ — biggest first\n- `:<10` — left-align in 10 characters\n- `:>8.2f` — right-align\
      \ in 8 characters with 2 decimals"
