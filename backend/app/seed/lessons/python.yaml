  - title: Scan a log for trouble
    summary: Count log levels and spot repeated errors.
    body_markdown: "Servers write logs all day. This script tallies each level (INFO,\
      \ WARNING, ERROR) and lists any error message that happened more than once —\
      \ the first thing to check when something breaks.\n\nIn real use, swap the `LOG`\
      \ string for `Path(\"app.log\").read_text()`.\n\n## What you will see\n\n```text\n\
      INFO    2\nERROR   2\nWARNING 1\nrepeated: db timeout\n```\n\n## The plan\n\n\
      1. Import Counter\n2. Paste in a sample log\n3. Count each level\n4. Find errors\
      \ that happened more than once\n5. Print the report\n\n## Before you type\n\n\
      - Press **Tab** once for each indent level. One Tab is 4 spaces.\n- **Enter**\
      \ keeps the indent of the line above. **Backspace** removes one level.\n- Blank\
      \ lines between parts are optional.\n- Stuck? Each hint gives **one step**:\
      \ every line, its line number, and its indent.\n\n## Step 1 of 5 · Import Counter\n\
      \nCounter will tally how often each log level and message appears.\n\n```python\n\
      from collections import Counter\n```\n\n## Step 2 of 5 · Paste in a sample log\n\
      \nA small fake log so the script has something to read. Triple quotes let a\
      \ string span many lines.\n\n```python\nLOG = \"\"\"\\\n2026-10-01 09:00 INFO\
      \ server started\n2026-10-01 09:05 WARNING disk at 80%\n2026-10-01 09:07 ERROR\
      \ db timeout\n2026-10-01 09:09 INFO request ok\n2026-10-01 09:12 ERROR db timeout\n\
      \"\"\"\n```\n\n- `\"\"\"\\` — the backslash stops the string from starting with\
      \ an empty line\n- `each line` — date, time, LEVEL, then the message\n\n## Step\
      \ 3 of 5 · Count each level\n\nTake the third word of every line (INFO, WARNING,\
      \ ERROR) and count them.\n\n```python\ndef level_counts(text: str) -> Counter:\n\
      \    levels = [line.split()[2] for line in text.splitlines() if line.strip()]\n\
      \    return Counter(levels)\n```\n\n- `text.splitlines()` — one item per line\n\
      - `line.split()[2]` — the third word; counting starts at 0\n- `if line.strip()`\
      \ — skip empty lines\n\n## Step 4 of 5 · Find errors that happened more than\
      \ once\n\nKeep only ERROR lines, cut off the date, time, and level, then keep\
      \ messages seen twice or more.\n\n```python\ndef repeated_errors(text: str)\
      \ -> list[str]:\n    errors = [line.split(\" \", 3)[3] for line in text.splitlines()\
      \ if \" ERROR \" in line]\n    return [msg for msg, count in Counter(errors).items()\
      \ if count > 1]\n```\n\n- `\" ERROR \" in line` — only error lines\n- `line.split(\"\
      \ \", 3)[3]` — split at the first 3 spaces only, so the message stays whole\n\
      - `count > 1` — only messages that repeated\n\n## Step 5 of 5 · Print the report\n\
      \nPrint each level with its count, biggest first, then any repeated errors.\n\
      \n```python\nif __name__ == \"__main__\":\n    for level, count in level_counts(LOG).most_common():\n\
      \        print(f\"{level:<8}{count}\")\n    for message in repeated_errors(LOG):\n\
      \        print(f\"repeated: {message}\")\n```\n\n- `.most_common()` — all levels,\
      \ highest count first\n- `f\"{level:<8}{count}\"` — pads the level to 8 characters\
      \ so the numbers line up"
