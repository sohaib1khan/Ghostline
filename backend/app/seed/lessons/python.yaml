  - title: Slice a list
    summary: Take part of a list.
    body_markdown: 'Slices work on lists exactly like on strings: `[start:end]` stops
      before `end`. A step of `-1` walks backwards.


      ### Example


      ```python

      nums = [10, 20, 30, 40, 50]

      print(nums[1:3])    # -> [20, 30]

      print(nums[:2])     # -> [10, 20]

      print(nums[-2:])    # -> [40, 50]

      print(nums[::-1])   # -> [50, 40, 30, 20, 10]

      ```


      **Watch out:** A slice is a new list. Changing it does not change the original.'
