  - title: Combine conditions
    summary: and, or, not.
    body_markdown: '`and` needs both sides true. `or` needs at least one. `not` flips
      a value.


      ### Example


      ```python

      age = 15

      print(age >= 13 and age <= 19)   # -> True


      day = "Sun"

      print(day == "Sat" or day == "Sun")  # -> True

      print(not True)                  # -> False

      ```


      **Watch out:** `day == "Sat" or "Sun"` is always true. Repeat the comparison:
      `day == "Sat" or day == "Sun"`.'
