- title: Daily scripts
  description: Intermediate — longer Python scripts with guided hints.
  status: published
  lessons:
  - title: Summarize a word list
    summary: Read lines, count words, print the top ones.
    body_markdown: "Count the words in a text file and print the five most common.\
      \ It is a small version of what word clouds and search tools do.\n\n## What\
      \ you will see\n\n```text\nthe: 12\ncode: 7\n```\n\n## The plan\n\n1. Import\
      \ the tools\n2. Start the function\n3. Read the file and keep only words\n4.\
      \ Count and return the top words\n5. Print the report\n\n## Before you type\n\
      \n- Press **Tab** once for each indent level. One Tab is 4 spaces.\n- **Enter**\
      \ keeps the indent of the line above. **Backspace** removes one level.\n- Blank\
      \ lines between parts are optional.\n- Stuck? Each hint gives **one step**:\
      \ every line, its line number, and its indent.\n\n## Step 1 of 5 · Import the\
      \ tools\n\nBring in two helpers from Python's standard library.\n\n```python\n\
      from collections import Counter\nfrom pathlib import Path\n```\n\n- `Counter`\
      \ — counts how many times each item appears\n- `Path` — reads a file with one\
      \ short call\n\n## Step 2 of 5 · Start the function\n\nName the function and\
      \ say what goes in and what comes out.\n\n```python\ndef top_words(path: str,\
      \ limit: int = 5) -> list[tuple[str, int]]:\n```\n\n- `path: str` — the file\
      \ name to read\n- `limit: int = 5` — how many words to return; 5 unless you\
      \ ask for another number\n- `-> list[tuple[str, int]]` — a type hint: it returns\
      \ pairs like (\"the\", 12)\n\n## Step 3 of 5 · Read the file and keep only words\n\
      \nLoad the whole file as text, lowercase it, then split it into words.\n\n```python\n\
      \    text = Path(path).read_text(encoding=\"utf-8\").lower()\n    words = [w\
      \ for w in text.split() if w.isalpha()]\n```\n\n- `.read_text(...)` — the file's\
      \ contents as one string\n- `.lower()` — so The and the count as the same word\n\
      - `text.split()` — cuts the text into words at every space or line break\n-\
      \ `w.isalpha()` — keeps only words made of letters, so 42 and -- are skipped\n\
      \n## Step 4 of 5 · Count and return the top words\n\nCount every word and hand\
      \ back the most frequent ones, biggest first.\n\n```python\n    return Counter(words).most_common(limit)\n\
      ```\n\n- `Counter(words)` — builds a word -> count table\n- `.most_common(limit)`\
      \ — the top pairs, highest count first\n\n## Step 5 of 5 · Print the report\n\
      \nCall the function on notes.txt and print one line per word.\n\n```python\n\
      if __name__ == \"__main__\":\n    for word, count in top_words(\"notes.txt\"\
      ):\n        print(f\"{word}: {count}\")\n```\n\n- `if __name__ == \"__main__\"\
      :` — run this part only when the file is started directly\n- `for word, count\
      \ in ...` — unpack each pair into two names\n- `f\"{word}: {count}\"` — prints\
      \ lines like the: 12"
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
