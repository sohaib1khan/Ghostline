  - title: Sets and running sums
    summary: Unique results and totals without a list.
    body_markdown: 'Braces **without** a colon build a set. Parentheses build a lazy
      generator, which `sum`, `max`, and friends can eat directly.


      ### Example


      ```python

      words = ["Hi", "hi", "HELLO"]

      unique = {w.lower() for w in words}

      print(sorted(unique))                # -> [''hello'', ''hi'']


      print(sum(n * n for n in range(4)))  # -> 14

      ```


      **Watch out:** A generator can be used only once. Make a list if you need the
      values twice.'
    status: published
