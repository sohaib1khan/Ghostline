    summary: Keys and values.
    body_markdown: 'A **dictionary** maps keys to values with `{key: value}`. Look
      a value up by its key in square brackets.


      ### Example


      ```python

      person = {"name": "Ada", "age": 36}

      print(person["name"])   # -> Ada

      print(person["age"])    # -> 36

      ```


      **Watch out:** `person["email"]` raises a KeyError when the key does not exist.
      See Safe lookup.'
