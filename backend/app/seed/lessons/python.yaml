  - title: Decorators
    summary: Wrap a function to add behavior.
    body_markdown: "A **decorator** takes a function and returns a new one that wraps\
      \ it. `@name` above a `def` applies it.\n\n### Example\n\n```python\ndef loud(func):\n\
      \    def wrapper(*args, **kwargs):\n        return func(*args, **kwargs).upper()\n\
      \    return wrapper\n\n@loud\ndef greet(name):\n    return f\"hi {name}\"\n\n\
      print(greet(\"ada\"))   # -> HI ADA\n```\n\n**Watch out:** Add `@functools.wraps(func)`\
      \ above `wrapper` in real code so the wrapped function keeps its name and docs."
    status: published
    is_demo: false
