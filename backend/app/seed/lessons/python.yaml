  - title: The walrus operator
    summary: Assign inside an expression.
    body_markdown: "`:=` stores a value **and** uses it in the same expression. It\
      \ saves calling something twice.\n\n### Example\n\n```python\nwords = [\"hi\"\
      , \"extraordinary\", \"ok\"]\nfor word in words:\n    if (size := len(word))\
      \ > 5:\n        print(f\"{word} is long ({size})\")\n# -> extraordinary is long\
      \ (13)\n```\n\n**Watch out:** Wrap it in parentheses. Use it to remove repetition,\
      \ not to squeeze lines."
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
    exercises:
