  - title: To-do list that remembers
    summary: A task list saved to JSON between runs.
    body_markdown: "A to-do list is only useful if it is still there tomorrow. Save\
      \ the tasks as JSON and load them back on start.\n\n## What you will see\n\n\
      ```text\n1. [x] write lesson\n2. [ ] push to GitHub\n```\n\n## The plan\n\n\
      1. Import the tools and pick a file\n2. Load and save\n3. Add and finish tasks\n\
      4. Show the list\n5. Use it\n\n## Before you type\n\n- Press **Tab** once for\
      \ each indent level. One Tab is 4 spaces.\n- **Enter** keeps the indent of the\
      \ line above. **Backspace** removes one level.\n- Blank lines between parts\
      \ are optional.\n- Stuck? Each hint gives **one step**: every line, its line\
      \ number, and its indent.\n\n## Step 1 of 5 · Import the tools and pick a file\n\
      \nTasks are saved as JSON text in todo.json.\n\n```python\nimport json\nfrom\
      \ pathlib import Path\n\nFILE = Path(\"todo.json\")\n```\n\n## Step 2 of 5 ·\
      \ Load and save\n\nload reads the saved tasks, or starts empty on the first\
      \ run. save writes them back.\n\n```python\ndef load():\n    if FILE.exists():\n\
      \        return json.loads(FILE.read_text())\n    return []\n\n\ndef save(tasks):\n\
      \    FILE.write_text(json.dumps(tasks, indent=2))\n```\n\n- `FILE.exists()`\
      \ — is there a saved list yet?\n- `json.loads / json.dumps` — text to Python\
      \ data, and back\n- `indent=2` — makes the saved file easy to read\n\n## Step\
      \ 3 of 5 · Add and finish tasks\n\nadd puts a new task at the end. finish marks\
      \ a task done by its number.\n\n```python\ndef add(tasks, title):\n    tasks.append({\"\
      title\": title, \"done\": False})\n\n\ndef finish(tasks, number):\n    tasks[number\
      \ - 1][\"done\"] = True\n```\n\n- `number - 1` — people count from 1, lists\
      \ count from 0\n\n## Step 4 of 5 · Show the list\n\nPrint each task with a number\
      \ and a checkbox.\n\n```python\ndef show(tasks):\n    for i, task in enumerate(tasks,\
      \ start=1):\n        mark = \"x\" if task[\"done\"] else \" \"\n        print(f\"\
      {i}. [{mark}] {task['title']}\")\n```\n\n- `enumerate(tasks, start=1)` — number\
      \ the tasks from 1\n- `\"x\" if task[\"done\"] else \" \"` — x when done, a\
      \ space when not\n\n## Step 5 of 5 · Use it\n\nLoad, add two tasks, finish the\
