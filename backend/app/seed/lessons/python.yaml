    summary: Trim spaces and swap words.
    body_markdown: '`strip()` removes spaces from both ends. `replace(old, new)` swaps
      every match.


      ### Example


      ```python

      raw = "  hello  "

      print(raw.strip())                   # -> hello


      print("cat".replace("c", "b"))       # -> bat

      print("a-b-c".replace("-", " "))     # -> a b c

      ```


      **Watch out:** Strings cannot be changed in place. Save the result: `raw = raw.strip()`.'
