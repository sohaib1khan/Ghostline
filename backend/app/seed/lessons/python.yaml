  - title: JSON
    summary: Save structured data as text.
    body_markdown: 'JSON is the most common way programs swap data. `json.dumps` turns
      dictionaries and lists into text, `json.loads` turns it back.


      ### Example


      ```python

      import json


      settings = {"theme": "dark", "size": 14}

      text = json.dumps(settings)

      print(text)                 # -> {"theme": "dark", "size": 14}


      loaded = json.loads(text)

      print(loaded["size"] + 1)   # -> 15

      ```


      **Watch out:** `dumps`/`loads` work with strings. `dump`/`load` (no s) work
      with open files.'
