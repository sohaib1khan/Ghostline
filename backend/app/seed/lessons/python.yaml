  - title: Context managers
    summary: Set up and clean up with with.
    body_markdown: "`with` guarantees clean-up runs. `@contextmanager` lets you write\
      \ your own: code before `yield` is the setup, code after is the clean-up.\n\n\
      ### Example\n\n```python\nfrom contextlib import contextmanager\n\n@contextmanager\n\
      def section(title):\n    print(f\"--- {title} ---\")\n    yield\n    print(\"\
      --- end ---\")\n\nwith section(\"Report\"):\n    print(\"all good\")\n# -> ---\
      \ Report ---\n# -> all good\n# -> --- end ---\n```"
