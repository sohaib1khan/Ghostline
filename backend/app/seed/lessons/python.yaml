  - title: Sort a list
    summary: Put items in order.
    body_markdown: '`list.sort()` sorts the list itself and returns nothing. `sorted(list)`
      returns a **new** sorted list and leaves the original alone.


      ### Example


      ```python

      numbers = [3, 1, 2]

      print(sorted(numbers))  # -> [1, 2, 3]

      print(numbers)          # -> [3, 1, 2]   (unchanged)


      numbers.sort()

      print(numbers)          # -> [1, 2, 3]   (changed)

      ```


      **Watch out:** `numbers = numbers.sort()` sets numbers to None, because `sort()`
      returns nothing.'
