  - title: Functions are values
    summary: Store, pass, and loop over functions.
    body_markdown: "A function name without parentheses is a value like any other.\
      \ You can keep functions in a list or a dictionary and call them later.\n\n\
      ### Example\n\n```python\ndef shout(text):\n    return text.upper() + \"!\"\n\
      \ndef whisper(text):\n    return text.lower() + \"...\"\n\nfor style in (shout,\
      \ whisper):\n    print(style(\"Hello\"))\n# -> HELLO!\n# -> hello...\n\nsquare\
      \ = lambda n: n * n\nprint(square(5))   # -> 25\n```"
