  - title: Empty or not
    summary: Truthy and falsy values.
    body_markdown: "An `if` does not need a comparison. Empty things count as **false**:\
      \ `\"\"`, `0`, `[]`, `{}`, and `None`. Everything else counts as true.\n\n###\
      \ Example\n\n```python\nname = \"\"\nif not name:\n    print(\"No name given\"\
      )   # -> No name given\n\nitems = [1, 2]\nif items:\n    print(\"Has items\"\
      )       # -> Has items\n```\n\n**Watch out:** `if items == True:` is not the\
      \ same check. Write `if items:`."
