  - title: Count and find
    summary: How many, and where.
    body_markdown: '`count` tells you how many times a piece appears. `find` gives
      the position of the first match, or `-1` when there is none.


      ### Example


      ```python

      text = "banana"

      print(text.count("a"))   # -> 3

      print(text.find("n"))    # -> 2

      print(text.find("z"))    # -> -1

      ```


      **Watch out:** `index` works like `find` but raises a ValueError when nothing
      matches. Use `find` when a miss is normal.'
