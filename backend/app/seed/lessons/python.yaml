      ## Step 1 of 3 · Clean one file name\n\nSplit off the extension, lowercase everything,\
      \ and join the words with dashes.\n\n```python\ndef tidy(name: str) -> str:\n\
      \    stem, _, ext = name.rpartition(\".\")\n    clean = \"-\".join(stem.lower().split())\n\
      \    return f\"{clean}.{ext.lower()}\"\n```\n\n- `name.rpartition(\".\")` —\
      \ splits at the LAST dot: stem, the dot, extension\n- `_` — a name for a value\
      \ we do not need (the dot)\n- `\"-\".join(stem.lower().split())` — lowercase\
      \ words joined with dashes\n- `f\"{clean}.{ext.lower()}\"` — put the name and\
      \ the lowercase extension back together\n\n## Step 2 of 3 · Plan the renames\n\
      \nPair each old name with its tidy version, but only when the name would change.\n\
      \n```python\ndef plan_renames(names: list[str]) -> list[tuple[str, str]]:\n\
      \    return [(old, tidy(old)) for old in names if tidy(old) != old]\n```\n\n\
      - `(old, tidy(old))` — a pair: before and after\n- `if tidy(old) != old` — skip\
      \ names that are already tidy\n\n## Step 3 of 3 · Print the plan\n\nTry it on\
