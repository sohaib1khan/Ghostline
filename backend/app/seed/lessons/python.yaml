  - title: Write a file
    summary: Create a file with text in it.
    body_markdown: "`with open(...)` opens a file and closes it automatically. Mode\
      \ `\"w\"` writes and **replaces** the file. Mode `\"a\"` appends.\n\n### Example\n\
      \n```python\nwith open(\"notes.txt\", \"w\") as f:\n    f.write(\"hello\\n\"\
      )\n\nwith open(\"notes.txt\", \"a\") as f:\n    f.write(\"world\\n\")\n\nprint(open(\"\
      notes.txt\").read().split())  # -> ['hello', 'world']\n```\n\n**Watch out:**\
      \ Mode `\"w\"` wipes the file first. Use `\"a\"` to keep existing text."
    status: published
