- title: Numbers and math
  description: Beginner — Calculate with Python.
  status: published
  lessons:
  - title: Arithmetic
    summary: Add, subtract, multiply, divide.
    body_markdown: 'Python follows normal math order: `*` and `/` before `+` and `-`.
      Use parentheses to change the order.


      ### Example


      ```python

      print(7 + 3 * 2)     # -> 13   (multiply first)

      print((7 + 3) * 2)   # -> 20   (parentheses first)


      # / always returns a float (a decimal number)

      print(10 / 4)        # -> 2.5

      print(10 / 2)        # -> 5.0

      ```'
