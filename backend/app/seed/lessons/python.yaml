- title: Formatting output
  description: Intermediate — Make numbers and tables look right.
  status: published
  lessons:
  - title: Decimal places
    summary: Control how numbers print.
    body_markdown: 'After the value in an f-string, a colon starts a **format spec**.
      `.2f` means two decimals, `%` shows a percent, and `,` adds thousands separators.


      ### Example


      ```python

      price = 3.14159

      print(f"{price:.2f}")     # -> 3.14

      print(f"{2 / 3:.1%}")     # -> 66.7%

      print(f"{1234567:,}")     # -> 1,234,567

      ```


      **Watch out:** Formatting only changes how the number looks. The value itself
      is not rounded.'
    status: published
    is_demo: false
    source_type: original
    source_attribution: ''
    source_url: ''
    license_note: ''
