  - title: Habit streak tracker
    summary: Current and longest streaks from a list of dates.
    body_markdown: "Log the days you did a habit. Count backwards from today for the\
      \ current streak, and scan sorted dates for the record.\n\n## What you will\
      \ see\n\n```text\nCurrent streak: 3 days\nLongest streak: 4 days\n```\n\n##\
      \ The plan\n\n1. Import dates and define one day\n2. Count the current streak\n\
      3. Find the longest streak\n4. Try it\n\n## Before you type\n\n- Press **Tab**\
      \ once for each indent level. One Tab is 4 spaces.\n- **Enter** keeps the indent\
      \ of the line above. **Backspace** removes one level.\n- Blank lines between\
      \ parts are optional.\n- Stuck? Each hint gives **one step**: every line, its\
      \ line number, and its indent.\n\n## Step 1 of 4 · Import dates and define one\
      \ day\n\ndate is a calendar day; timedelta is a length of time.\n\n```python\n\
      from datetime import date, timedelta\n\nONE_DAY = timedelta(days=1)\n```\n\n\
      ## Step 2 of 4 · Count the current streak\n\nStart at today and step back one\
      \ day at a time while the habit was done.\n\n```python\ndef current_streak(days,\
      \ today):\n    done = set(days)\n    streak = 0\n    while today in done:\n\
      \        streak += 1\n        today -= ONE_DAY\n    return streak\n```\n\n-\
      \ `set(days)` — fast yes/no lookups\n- `today -= ONE_DAY` — move back one day\n\
      \n## Step 3 of 4 · Find the longest streak\n\nWalk through the days in order.\
      \ A day right after the previous one extends the run; a gap restarts it.\n\n\
      ```python\ndef longest_streak(days):\n    best = run = 0\n    previous = None\n\
      \    for day in sorted(set(days)):\n        run = run + 1 if previous and day\
      \ - previous == ONE_DAY else 1\n        best = max(best, run)\n        previous\
      \ = day\n    return best\n```\n\n- `sorted(set(days))` — unique days, oldest\
      \ first\n- `run + 1 if ... else 1` — extend the run, or start over at 1\n- `max(best,\
      \ run)` — keep the record\n\n## Step 4 of 4 · Try it\n\nEight sample days in\
      \ September, then print both streaks.\n\n```python\nlog = [date(2026, 9, d)\
      \ for d in (20, 21, 22, 23, 26, 28, 29, 30)]\nprint(f\"Current streak: {current_streak(log,\
      \ date(2026, 9, 30))} days\")\nprint(f\"Longest streak: {longest_streak(log)}\
      \ days\")\n```\n\n## What you practice\n\n`datetime.date`, `timedelta`, sets\
      \ for fast lookups, `sorted`, and an inline if.\n\n## Stretch goal\n\nStore\
      \ the log in a JSON file and print a 30-day calendar strip like `##.#.###`."
