  - title: Compare values
    summary: Equal, not equal, bigger, smaller.
    body_markdown: 'Comparisons give `True` or `False`: `==` equal, `!=` not equal,
      `<`, `>`, `<=`, `>=`.


      ### Example


      ```python

      print(5 == 5)     # -> True

      print(5 != 3)     # -> True

      print(2 >= 3)     # -> False

      print("a" < "b")  # -> True

      ```


      **Watch out:** One `=` assigns. Two `==` compare. `if x = 5:` is a syntax error.'
