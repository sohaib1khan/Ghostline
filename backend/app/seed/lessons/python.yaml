  - title: Tiny link shortener
    summary: Short codes from a hash, and back again.
    body_markdown: "Hash a URL, keep the first six characters as its code, and store\
      \ the mapping so the short link can be expanded.\n\n## What you will see\n\n\
      ```text\nhttps://short.example/274d4c\nhttps://github.com/sohaib1khan/Ghostline\n\
      not found\n```\n\n## The plan\n\n1. Import hashlib\n2. Set up the shortener\n\
      3. Make a short link\n4. Look a short link up\n5. Try it\n\n## Before you type\n\
      \n- Press **Tab** once for each indent level. One Tab is 4 spaces.\n- **Enter**\
      \ keeps the indent of the line above. **Backspace** removes one level.\n- Blank\
      \ lines between parts are optional.\n- Stuck? Each hint gives **one step**:\
      \ every line, its line number, and its indent.\n\n## Step 1 of 5 · Import hashlib\n\
      \nhashlib turns any text into a fixed fingerprint.\n\n```python\nimport hashlib\n\
      ```\n\n## Step 2 of 5 · Set up the shortener\n\nRemember the base address and\
      \ a dictionary of code -> long link.\n\n```python\nclass Shortener:\n    def\
      \ __init__(self, base=\"https://short.example/\"):\n        self.base = base\n\
      \        self.links = {}\n```\n\n## Step 3 of 5 · Make a short link\n\nFingerprint\
      \ the link, keep the first 6 characters as its code, and save the pair.\n\n\
      ```python\n    def shorten(self, url):\n        code = hashlib.sha256(url.encode()).hexdigest()[:6]\n\
      \        self.links[code] = url\n        return self.base + code\n```\n\n- `url.encode()`\
      \ — text to bytes, which hashlib needs\n- `.hexdigest()[:6]` — the fingerprint\
      \ as letters and digits; keep 6\n\n## Step 4 of 5 · Look a short link up\n\n\
      Strip the base address to get the code, then find the long link.\n\n```python\n\
      \    def expand(self, short):\n        code = short.removeprefix(self.base)\n\
      \        return self.links.get(code, \"not found\")\n```\n\n- `removeprefix(self.base)`\
      \ — drop the base from the front\n- `.get(code, \"not found\")` — a safe lookup\
      \ with a fallback\n\n## Step 5 of 5 · Try it\n\nShorten a link, expand it, and\
      \ try a code that does not exist.\n\n```python\ns = Shortener()\nshort = s.shorten(\"\
      https://github.com/sohaib1khan/Ghostline\")\nprint(short)\nprint(s.expand(short))\n\
      print(s.expand(\"https://short.example/zzzzzz\"))\n```\n\n## What you practice\n\
      \n`hashlib`, `.encode()`, slicing, a class with a dictionary inside, and `removeprefix`.\n\
      \n## Stretch goal\n\nSave the links to JSON and handle the rare case where two\
      \ URLs get the same code."
