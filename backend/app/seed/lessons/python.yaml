  - title: Inline if
    summary: Pick one of two values in a single expression.
    body_markdown: '`a if condition else b` gives `a` when the condition is true and
      `b` otherwise. It works anywhere a value fits, even inside a comprehension.


      ### Example


      ```python

      age = 20

      label = "adult" if age >= 18 else "minor"

      print(label)   # -> adult


      nums = [1, 2, 3, 4]

      print(["even" if n % 2 == 0 else "odd" for n in nums])

      # -> [''odd'', ''even'', ''odd'', ''even'']

      ```


      **Watch out:** Keep it short. If you need `elif`, use a normal `if` block.'
