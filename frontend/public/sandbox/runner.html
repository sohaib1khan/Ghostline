<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ghostline sandbox</title>
  </head>
  <body>
    <script>
      // DECISION: this frame is same-origin so it can load /pyodide. A unique
      // origin cannot start the Pyodide module worker. Learner code runs in the
      // worker below, after network calls are replaced. The parent page keeps
      // a script policy with no eval.
      const RUN_MS = 3000;
      const GHOSTWALK_RUN_MS = 15000;
      const LOAD_MS = 20000;

      function reply(payload) {
        parent.postMessage({ source: "ghostline-sandbox", ...payload }, "*");
      }

      function jsWorker() {
        return `
          const lines = [];
          const write = (...args) => lines.push(args.map((item) => String(item)).join(" "));
          self.console = { log: write, info: write, warn: write, error: write };
          self.fetch = () => Promise.reject(new Error("Network is disabled"));
          self.XMLHttpRequest = class {
            open() { throw new Error("Network is disabled"); }
          };
          self.importScripts = () => { throw new Error("Network is disabled"); };
          self.onmessage = (event) => {
            try {
              const run = new Function(String(event.data.code || ""));
              run();
              self.postMessage({ output: lines.join("\\n") });
            } catch (error) {
              self.postMessage({
                output: String(error && error.message ? error.message : error),
                error: "runtime",
              });
            }
          };
        `;
      }

      function pythonWorker(indexURL) {
        return `
          import { loadPyodide } from "${indexURL}pyodide.mjs";
          const lines = [];
          let pyodide;
          try {
            pyodide = await loadPyodide({
              indexURL: "${indexURL}",
              stdout: (text) => lines.push(String(text)),
              stderr: (text) => lines.push(String(text)),
            });
          } catch (error) {
            self.postMessage({
              output: String(error && error.message ? error.message : error),
              error: "runtime",
            });
            throw error;
          }
          self.fetch = () => Promise.reject(new Error("Network is disabled"));
          self.XMLHttpRequest = class {
            open() { throw new Error("Network is disabled"); }
          };
          self.importScripts = () => { throw new Error("Network is disabled"); };
          self.onmessage = (event) => {
            try {
              pyodide.runPython(String(event.data.code || ""));
              self.postMessage({ output: lines.join("\\n") });
            } catch (error) {
              self.postMessage({
                output: String(error && error.message ? error.message : error),
                error: "runtime",
              });
            }
          };
          self.postMessage({ ready: true });
        `;
      }

      function ghostwalkWorker(indexURL) {
        return `
          import { loadPyodide } from "${indexURL}pyodide.mjs";
          let pyodide;
          try {
            pyodide = await loadPyodide({ indexURL: "${indexURL}" });
          } catch (error) {
            self.postMessage({
              output: String(error && error.message ? error.message : error),
              error: "runtime",
            });
            throw error;
          }
          self.fetch = () => Promise.reject(new Error("Network is disabled"));
          self.XMLHttpRequest = class {
            open() { throw new Error("Network is disabled"); }
          };
          self.importScripts = () => { throw new Error("Network is disabled"); };
          self.onmessage = (event) => {
            try {
              const worldSource = String(event.data.worldSource || "");
              const skinsSource = String(event.data.skinsSource || "");
              const code = String(event.data.code || "");
              const language = String(event.data.language || "python");
              const levelJson = JSON.stringify(event.data.level || {});
              pyodide.runPython(worldSource);
              if (skinsSource) {
                pyodide.runPython(skinsSource);
              }
              pyodide.globals.set("_gw_level_json", levelJson);
              pyodide.globals.set("_gw_code", code);
              pyodide.globals.set("_gw_language", language);
              pyodide.globals.set("_gw_use_skins", Boolean(skinsSource));
              const raw = pyodide.runPython(\`
import json
import types
_level = json.loads(_gw_level_json)
_language = str(_gw_language or "python")
if _language == "python" or not _gw_use_skins:
    _result = run_learner_code(_level, _gw_code)
else:
    _world = types.SimpleNamespace(run_learner_code=run_learner_code)
    _result = run(_world, _level, _language, _gw_code)
json.dumps(_result)
\`);
              const text = String(raw);
              self.postMessage({ output: text, result: JSON.parse(text) });
            } catch (error) {
              self.postMessage({
                output: String(error && error.message ? error.message : error),
                error: "runtime",
              });
            }
          };
          self.postMessage({ ready: true });
        `;
      }

      function ghostwalkJsWorker() {
        return `
          self.onmessage = (event) => {
            try {
              const worldJs = String(event.data.worldSource || "");
              const code = String(event.data.code || "");
              const level = event.data.level || {};
              // Load shared engine into this worker scope.
              (0, eval)(worldJs);
              if (!self.GhostwalkWorld || !self.GhostwalkWorld.runLearnerCode) {
                throw new Error("Ghostwalk JS world failed to load.");
              }
              const result = self.GhostwalkWorld.runLearnerCode(level, code);
              self.postMessage({ output: JSON.stringify(result), result });
            } catch (error) {
              self.postMessage({
                output: String(error && error.message ? error.message : error),
                error: "runtime",
              });
            }
          };
          self.postMessage({ ready: true });
        `;
      }

      window.addEventListener("message", (event) => {
        if (event.source !== parent) return;
        if (!event.data || event.data.source !== "ghostline-parent") return;
        if (!/^https?:\/\/[A-Za-z0-9.:-]+$/.test(event.origin)) return;
        const kind = event.data.runtime;
        const runtime =
          kind === "ghostwalk"
            ? "ghostwalk"
            : kind === "ghostwalk_js"
              ? "ghostwalk_js"
              : kind === "pyodide"
                ? "pyodide"
                : "browser_js";
        const indexURL = event.origin + "/pyodide/";
        const source =
          runtime === "ghostwalk"
            ? ghostwalkWorker(indexURL)
            : runtime === "ghostwalk_js"
              ? ghostwalkJsWorker()
              : runtime === "pyodide"
                ? pythonWorker(indexURL)
                : jsWorker();
        const blob = new Blob([source], { type: "text/javascript" });
        const url = URL.createObjectURL(blob);
        let worker;
        try {
          worker = new Worker(
            url,
            runtime === "browser_js" || runtime === "ghostwalk_js" ? undefined : { type: "module" },
          );
        } catch (error) {
          URL.revokeObjectURL(url);
          reply({
            output: String(error && error.message ? error.message : error),
            error: "runtime",
          });
          return;
        }
        let settled = false;
        let timer = 0;
        const runLimit =
          runtime === "ghostwalk" || runtime === "ghostwalk_js" ? GHOSTWALK_RUN_MS : RUN_MS;

        function finish(payload) {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          worker.terminate();
          URL.revokeObjectURL(url);
          reply(payload);
        }

        timer = window.setTimeout(() => finish({ output: "", error: "timeout" }), LOAD_MS);
        worker.onmessage = (message) => {
          const data = message.data || {};
          if (data.ready) {
            window.clearTimeout(timer);
            timer = window.setTimeout(() => finish({ output: "", error: "timeout" }), runLimit);
            worker.postMessage({
              code: String(event.data.code || ""),
              level: event.data.level || null,
              language: event.data.language || "python",
              worldSource: event.data.worldSource || null,
              skinsSource: event.data.skinsSource || null,
              worldJsUrl: event.data.worldJsUrl || null,
            });
            return;
          }
          finish({
            output: data.output || "",
            error: data.error || null,
            result: data.result || null,
          });
        };
        worker.onerror = (errEvent) => {
          finish({
            output: String(errEvent && errEvent.message ? errEvent.message : "worker error"),
            error: "runtime",
          });
        };
        if (runtime === "browser_js") {
          window.clearTimeout(timer);
          timer = window.setTimeout(() => finish({ output: "", error: "timeout" }), runLimit);
          worker.postMessage({ code: String(event.data.code || "") });
        }
      });
    </script>
  </body>
</html>
