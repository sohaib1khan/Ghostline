worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8m;

    # Writable by the unprivileged nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # DECISION: HSTS is not set in this image. The same container serves
        # plain HTTP on localhost, and a remembered HSTS policy breaks that.
        # Put Strict-Transport-Security on the TLS proxy in production.
        include /etc/nginx/ghostline-headers.conf;

        # DECISION: the worker and manifest must be revalidated. A long-lived
        # copy would keep an old shell after a deploy. These locations set
        # their own headers, so they include the shared policy again.
        location = /sw.js {
            include /etc/nginx/ghostline-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            include /etc/nginx/ghostline-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location ~ ^/workbox-[^/]+\.js$ {
            include /etc/nginx/ghostline-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # DECISION: learner JS and Python run in this framed page, not the app.
        # Its script policy allows eval and wasm. The app policy above does not.
        # No X-Frame-Options here, so the app can frame it. frame-ancestors stays self.
        location /sandbox/ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            try_files $uri =404;
        }

        # DECISION: the sandbox frame is same-origin with the app so it can load
        # these files. CORS stays on so a module worker can fetch them. Pyodide
        # stays on this origin. It is not loaded from a CDN.
        location /pyodide/ {
            types {
                application/wasm wasm;
                text/javascript mjs js;
                application/json json;
                application/zip zip;
            }
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
